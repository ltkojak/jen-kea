{% extends "base.html" %}
{% block title %}Import Complete{% endblock %}
{% block content %}
<div class="page-header">
    <h1>🪟 Import Complete</h1>
    <p>Here's what happened.</p>
</div>

<div class="card" style="margin-bottom:20px;">
    <div class="card-header"><h3>Result</h3></div>
    <ul style="margin:0;padding-left:20px;font-size:13px;">
        {% for line in report %}
        <li>{{ line }}</li>
        {% endfor %}
    </ul>
</div>

{% if restart_failed %}
<form method="post" action="{{ url_for('subnets.import_windows_apply_reservations') }}" style="display:inline;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="btn btn-primary">Add the reservations now</button>
</form>
{% endif %}
<a href="{{ url_for('subnets.subnets') }}" class="btn btn-primary">← Back to Subnets</a>
{% endblock %}
