{% extends "base.html" %}
{% block title %}Edit Reservation{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{{ icon("pencil", "ico-lg") }} Edit Reservation</h1>
    <p>{{ host.ip }} — {{ host.mac }}</p>
</div>
<div class="card u-cd90f7">
    <div style="background:var(--surface2);border-radius:var(--radius);padding:12px;margin-bottom:20px;font-size:12px;color:var(--text-muted);">
        IP address and MAC cannot be changed. Delete and recreate the reservation to change these.
    </div>
    <form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-row">
            <div class="form-group">
                <label>IP Address</label>
                <input type="text" value="{{ host.ip }}" disabled class="u-e1549f">
            </div>
            <div class="form-group">
                <label>MAC Address</label>
                <input type="text" value="{{ host.mac }}" disabled class="u-e1549f">
            </div>
        </div>
        <div class="form-group">
            <label for="f-hostname">Hostname</label>
            <input id="f-hostname" type="text" name="hostname" value="{{ host.hostname or '' }}">
        </div>
        <div class="form-group">
            <label for="f-dns_override">DNS Override</label>
            <input id="f-dns_override" type="text" name="dns_override" value="{{ host.dns_override }}" placeholder="Leave blank for subnet default">
        </div>
        <div class="form-group">
            <label for="f-notes">Notes</label>
            <textarea id="f-notes" name="notes" rows="2">{{ host.notes or '' }}</textarea>
        </div>
        <div class="u-a76d59">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="/reservations" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
