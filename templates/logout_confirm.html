{% extends "base.html" %}
{% block title %}Sign out{% endblock %}
{% block content %}
<div class="page-header">
    <h1>⏻ Sign out</h1>
    <p>End your session on this device?</p>
</div>

<div class="card u-0fd874">
    <form method="POST" action="{{ url_for('auth.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="u-a76d59">
            <button type="submit" class="btn btn-danger">Sign out</button>
            <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-secondary">Stay signed in</a>
        </div>
    </form>
</div>
{% endblock %}
