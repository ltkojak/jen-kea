version: 2
updates:
  # GitHub Actions — the three third-party actions in tests.yml/release.yml
  # are pinned to commit SHAs (see CHANGELOG v4.4.4 for why: supply-chain
  # hardening against a moved tag). Dependabot opens a PR to bump the
  # pinned SHA forward when a new release exists, keeping the "# vN"
  # comment and the commit in sync.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # pip — v5.4.1 gave Jen a real requirements.txt (the single source of
  # truth, floor-pinned; see docs/ARCHITECTURE.md §3.5). Dependabot can
  # now parse it and surface "here's a newer compatible release you
  # should test." That complements pip-audit, which answers the
  # different question "something installed has a known CVE."
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
