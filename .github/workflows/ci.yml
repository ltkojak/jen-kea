name: CI

on:
  # A push runs CI on main and on a stable hotfix branch (release/X.Y); every other branch is
  # tested by its pull request. Before this, a Dependabot branch ran the whole suite twice,
  # once for the push and once for the pull request.
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

# v5.67.0-beta.10 (Q122) — see tests.yml: every step under pipefail, enforced by tests/test_workflow_hygiene.py.
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  test:
    uses: ./.github/workflows/tests.yml
    secrets:
      JEN_DOCS_FORBIDDEN: ${{ secrets.JEN_DOCS_FORBIDDEN }}
