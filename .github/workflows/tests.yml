name: Tests

# Reusable workflow — called by ci.yml (every push/PR) and release.yml
# (gates every tagged release). Not meant to be triggered directly.
on:
  workflow_call:
    inputs:
      # v5.66.0-beta.2 (Q104): release.yml signs one exact commit (the tag) and
      # must test that SAME commit, not whatever main has drifted to by the time
      # this job runs. Empty default means every existing caller (ci.yml, and
      # release.yml before this Q) keeps testing github.ref unchanged.
      ref:
        required: false
        type: string
        default: ''
    secrets:
      # Q97 k: the docs-screenshot leak guard's personal markers. Passed by name from each
      # caller (never `secrets: inherit`: release.yml holds the signing key).
      JEN_DOCS_FORBIDDEN:
        required: false

permissions:
  contents: read

# v5.67.0-beta.10 (Q122) — every step runs under `bash -eo pipefail`, never the
# runner's default `bash -e`. Without pipefail a pipeline's status is its LAST
# command's: `install.sh … | tee log` reported tee's success whatever the
# installer did. tests/test_workflow_hygiene.py refuses a workflow that drops
# this, a step that overrides it, `! grep` (bash exempts a negated command from
# errexit, so every such "assertion" was a no-op) and `cmd | grep -q` (under
# pipefail an early-exiting grep SIGPIPEs the writer: fails for the wrong reason).
defaults:
  run:
    shell: bash -eo pipefail {0}

env:
  # The stable release the upgrade-from-stable job starts from — PINNED, not
  # "whatever latest is": a new release must never silently change what an
  # old test means. Moved in the first release commit after a promotion
  # (CLAUDE.md "Release channels", step 4); tests/test_workflow_hygiene.py
  # checks its shape and that it is never newer than the tree.
  JEN_STABLE_VERSION: '5.66.0'

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }} · ${{ matrix.db-image }})
    runs-on: ubuntu-latest

    # README claims Python 3.10+ / Ubuntu 22.04 (which ships 3.10). With
    # floor-pinned deps a future "latest compatible" package could quietly
    # drop 3.10 while CI stayed green on 3.12 — so test the real floor too.
    # Jen also claims MySQL *or* MariaDB support; the third leg exercises
    # MySQL 8 (only MariaDB was tested through v5.7.x). The MariaDB image
    # honors the MYSQL_* env vars too, so one block covers both.
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            db-image: mariadb:10.11
            db-ping: mariadb-admin ping -h 127.0.0.1 -u root -pci_root_pw
          - python-version: '3.12'
            db-image: mariadb:10.11
            db-ping: mariadb-admin ping -h 127.0.0.1 -u root -pci_root_pw
          - python-version: '3.12'
            db-image: mysql:8.0
            db-ping: mysqladmin ping -h 127.0.0.1 -u root -pci_root_pw

    # v5.5.x — JEN_ROOT (v5.3.3) points the app's static/template/plugin
    # paths at the checkout, replacing the old `ln -sf` into /opt/jen.
    # If the override didn't work, these tests wouldn't run at all.
    env:
      JEN_ROOT: ${{ github.workspace }}

    services:
      database:
        image: ${{ matrix.db-image }}
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: jen_test
          MYSQL_USER: jen
          MYSQL_PASSWORD: ci_jen_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.db-ping }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Runtime pins come from requirements.txt (the single source of
        # truth, shared with install.sh and Dockerfile). Never re-list
        # packages here — tests/test_dependency_consistency.py enforces it.
        run: pip install -q -r requirements.txt pytest pyyaml

      - name: Provision /etc/jen
        # init_jen_db() unconditionally does os.makedirs("/etc/jen/ssl")
        # and os.makedirs("/etc/jen/ssh") on startup — fine on a real
        # deployment (Jen runs as www-data, which owns /etc/jen), but on
        # a fresh GitHub-hosted runner /etc/jen doesn't exist and the
        # default non-root "runner" user can't create it under /etc
        # without sudo. Create it once here and hand over ownership so
        # nothing later in the run needs sudo for it again.
        run: |
          sudo mkdir -p /etc/jen/ssl /etc/jen/ssh
          sudo chown -R "$(whoami)" /etc/jen

      - name: Let the test user create scratch databases
        # v5.67.0-beta.11 (Q123) — the Kea/Jen migration tests copy into a SECOND database on the same server,
        # and the service container's MYSQL_USER only owns jen_test. The grant covers names that start with
        # jen_test_ and nothing else; tests/test_kea_binary_roundtrip.py FAILS (never skips) under CI if it
        # cannot create one, so this step cannot be quietly dropped.
        run: |
          mysql -h 127.0.0.1 -u root -pci_root_pw -e 'GRANT ALL PRIVILEGES ON `jen\_test\_%`.* TO "jen"@"%"; FLUSH PRIVILEGES;'

      - name: Run test suite
        env:
          JEN_DB_HOST: 127.0.0.1
          JEN_DB_USER: jen
          JEN_DB_PASS: ci_jen_pw
        run: |
          python3 -m pytest tests/ -v

  # v5.39.0 (Q40) — a small Playwright suite driving a real Chromium
  # against a real create_app() (werkzeug, ephemeral port, background
  # thread) and a real MariaDB, plus a fake Kea Control Agent
  # (tests/e2e/_fake_kea_server.py). Matrix-free (one Python, one DB) —
  # this suite exercises browser JS and page wiring, not database
  # portability, which the matrix above already covers. Runs after
  # `pytest` so a broken unit suite fails fast without waiting on
  # Chromium; gates releases the same way every job in this workflow
  # does (release.yml calls this whole workflow via workflow_call).
  e2e:
    name: e2e (Playwright)
    needs: pytest
    runs-on: ubuntu-latest

    env:
      JEN_ROOT: ${{ github.workspace }}

    services:
      database:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: jen_test
          MYSQL_USER: jen
          MYSQL_PASSWORD: ci_jen_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -pci_root_pw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        # Same single-source-of-truth rule as the pytest job above, plus
        # the two e2e-only packages (requirements-dev.txt, not a runtime
        # pin — test_dependency_consistency.py only governs requirements.txt).
        run: pip install -q -r requirements.txt pytest pyyaml playwright pytest-playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Provision /etc/jen
        run: |
          sudo mkdir -p /etc/jen/ssl /etc/jen/ssh
          sudo chown -R "$(whoami)" /etc/jen

      - name: Run e2e suite
        env:
          JEN_DB_HOST: 127.0.0.1
          JEN_DB_USER: jen
          JEN_DB_PASS: ci_jen_pw
        run: python -m pytest tests/e2e -m e2e -v --tracing=retain-on-failure

      # Q62: a second pytest step, its own database (the live_server fixture's
      # _reset_test_db() drops the journeys' tables first, as it always does),
      # generating the README's screenshots from tests/e2e/demo_data.py's
      # fictional dataset instead of a real install. tests/e2e/test_docs_screenshots.py
      # skips itself unless JEN_E2E_DATASET=demo, so this is the only place that ever runs.
      - name: Run docs screenshot suite
        env:
          JEN_DB_HOST: 127.0.0.1
          JEN_DB_USER: jen
          JEN_DB_PASS: ci_jen_pw
          JEN_E2E_DATASET: demo
          # Q97 k: the leak guard's personal markers. A dependabot run and a pull request from a fork are
          # given no secrets by GitHub, so the "was it present" assertion is not required there (Q99 j).
          JEN_DOCS_FORBIDDEN: ${{ secrets.JEN_DOCS_FORBIDDEN }}
          JEN_DOCS_FORBIDDEN_REQUIRED: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.fork != true && '1' || '' }}
        run: python -m pytest tests/e2e/test_docs_screenshots.py -m e2e -v

      - name: Upload docs screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-screenshots
          path: artifacts/docs/
          retention-days: 30
          if-no-files-found: warn

      # v5.51.0 (Q58): the phone (390 x 844) and desktop (1440 x 900) screenshots
      # tests/e2e/test_mobile.py writes. Uploaded on EVERY run — pass or fail — so
      # the pages can be reviewed on a phone without reproducing anything locally.
      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-screenshots
          path: artifacts/mobile/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload desktop screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-screenshots
          path: artifacts/desktop/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Pinned — `ruff format`'s output shifts subtly between releases, so an
      # unpinned bump could fail `format --check` on a no-op. Dependabot PRs
      # the bump; reformat in that same PR if it drifts.
      - name: Install ruff
        run: pip install -q ruff==0.16.6

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # v5.9.1 — install.sh is a load-bearing part of the deployment story
      # and had no static-analysis gate. Severity `error` to start: the
      # script predated this check and carried style warnings.
      # v5.67.0 (Q113, item d) — raised to `warning` now that both scripts
      # are actually clean at that level (four real findings fixed: two
      # unused color variables, require_root() referencing $* when nothing
      # ever passes it args, and one `local x=$(cmd)` that could mask a
      # failing command's exit status).
      - name: shellcheck (warnings)
        run: shellcheck -S warning install.sh uninstall.sh

  # v5.67.0-beta.5 (Q117) — _layout_ancestors_ok refuses outright (never
  # just warns) when an EXISTING ancestor of a layout directory is
  # writable by group or other: a local user could otherwise rename the
  # root-owned child aside after install finishes and plant a symlink in
  # its place for the next privileged run to follow. Needs no Kea/DB/
  # tarball — the check runs at the very top of install.sh, before
  # main() — so this is deliberately its own small job, not folded into
  # the heavy `install` job below.
  install-layout-negative:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: A group/other-writable ancestor is refused
        run: |
          sudo mkdir -p /opt/permissive-parent
          sudo chmod 777 /opt/permissive-parent
          set +e
          out=$(sudo TERM=linux ./install.sh --app-dir /opt/permissive-parent/jen 2>&1)
          rc=$?
          set -e
          echo "$out"
          [[ $rc -ne 0 ]]
          grep -q "writable by group or other" <<< "$out"
          # v5.67.0-beta.10 (Q122) — and WHICH directory: the refusal names the
          # exact ancestor, which is what the operator's one-line fix targets
          grep -q "existing parent /opt/permissive-parent is writable by group or other" <<< "$out"
          echo "refused as expected, naming /opt/permissive-parent — rc=$rc"

  # v5.67.0 (Q113) — install.sh had never actually been run by anything
  # before this: CI provisioned /opt/jen and /etc/jen by hand and the
  # system-test suite runs Jen in Docker. This runs the REAL script
  # against REAL systemd, REAL sudo, a REAL MariaDB and a REAL kea-dhcp4,
  # on both Ubuntu releases the README claims support for: a fresh
  # install from an --answers file, the upgrade every operator is about
  # to make (latest stable, signature-verified, then this commit's
  # tarball over it), and uninstall. Gates release.yml the same way
  # every job in this reusable workflow does.
  install:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    env:
      JEN_ROOT: ${{ github.workspace }}
      # v5.67.0-beta.1 (Q113): kept in sync with kea-compat.yml's own
      # non-dev matrix legs by hand — this job needs exactly one real,
      # stable Kea, not the whole compatibility matrix.
      KEA_IMAGE: docker.cloudsmith.io/isc/docker/kea-dhcp4:3.2.0

    # Kea's own database. Jen's database is provisioned on this same
    # server in a step below — the common real-world topology (both on
    # one host) needs only one MariaDB image running, not two.
    services:
      database:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: kea
          MYSQL_USER: kea
          MYSQL_PASSWORD: kea_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -pci_root_pw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # v5.67.0-beta.5 (Q117) — this hosted runner image ships /opt mode
      # 777 (its own tool-cache installers write there without sudo);
      # _layout_ancestors_ok now refuses that outright rather than
      # warning (see install-layout-negative above for the check itself),
      # so every /opt/jen leg below needs a sane /opt first. A real host
      # is already like this — install-layout-negative is what still
      # proves the check itself works.
      - name: Harden /opt for this runner
        run: sudo chmod 755 /opt

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies (for the Kea config generator)
        run: pip install -q -r requirements.txt

      - name: Jen's database, Kea's schema and a real kea-dhcp4
        uses: ./.github/actions/kea-fixture
        with:
          kea-image: ${{ env.KEA_IMAGE }}

      - name: Build this commit's tarball
        run: |
          mkdir -p dist
          git archive --format=tar --prefix=jen/ HEAD | gzip -9 > dist/jen-head.tar.gz
          ls -lh dist/

      - name: Write the answers file
        # v5.67.0 (Q113) — JEN_INITIAL_ADMIN_PASSWORD set means init_jen_db()
        # seeds the admin account with THIS password and must_change_password=0
        # (see jen/models/db.py) — the login assertion below logs in with it.
        run: |
          umask 077
          cat > "$RUNNER_TEMP/answers.env" << 'EOF'
          JEN_KEA_API_URL=http://127.0.0.1:8004
          JEN_KEA_API_USER=jen
          JEN_KEA_API_PASS=jen_api_pw
          JEN_KEA_DB_HOST=127.0.0.1
          JEN_KEA_DB_USER=kea
          JEN_KEA_DB_PASS=kea_pw
          JEN_KEA_DB_NAME=kea
          JEN_DB_HOST=127.0.0.1
          JEN_DB_USER=jen
          JEN_DB_PASS=jen_pw
          JEN_DB_NAME=jen
          JEN_INITIAL_ADMIN_PASSWORD=ci-test-passw0rd-!
          JEN_SUBNETS=1=Test,10.99.0.0/24
          JEN_HTTP_PORT=5050
          JEN_HTTPS_PORT=8443
          EOF

      - name: Fresh install from the answers file
        run: |
          mkdir -p "$RUNNER_TEMP/install-head"
          tar xzf dist/jen-head.tar.gz -C "$RUNNER_TEMP/install-head"
          cd "$RUNNER_TEMP/install-head/jen"
          sudo TERM=linux ./install.sh --answers "$RUNNER_TEMP/answers.env" --unattended

      - name: Assert the fresh install is real
        run: |
          set -e
          systemctl is-active --quiet jen
          systemctl is-enabled --quiet jen
          echo "service active and enabled"

          grep -q jen_version < <(curl -sf http://127.0.0.1:5050/api/v1/health)
          echo "health endpoint answers"

          [[ "$(sudo stat -c '%U:%G' /opt/jen/current/app/run.py)" == "root:root" ]]
          sudo -u www-data test ! -w /opt/jen/current/app/run.py
          echo "app tree root-owned, not writable by the service user"

          [[ "$(sudo stat -c '%a' /etc/jen/jen.config)" == "600" ]]
          [[ "$(sudo stat -c '%U:%G' /etc/jen/jen.config)" == "www-data:www-data" ]]
          echo "jen.config is 0600, service-owned"

          sudo visudo -c -f /etc/sudoers.d/jen
          echo "sudoers entry is valid"

          systemctl cat jen-update.service >/dev/null
          systemctl cat jen-plugin-install.service >/dev/null
          echo "the three units are installed"

          cookie="$RUNNER_TEMP/cookies.txt"
          csrf=$(curl -sc "$cookie" http://127.0.0.1:5050/login | grep -m1 -oP 'name="csrf_token" value="\K[^"]+')
          [[ -n "$csrf" ]]
          code=$(curl -sb "$cookie" -c "$cookie" -X POST http://127.0.0.1:5050/login \
            -d "username=admin&password=ci-test-passw0rd-!&csrf_token=$csrf" \
            -o /dev/null -w '%{http_code}')
          [[ "$code" =~ ^3 ]]
          echo "logged in as admin with the answers file's own password"

      # v5.67.0-beta.6 (Q118) — jen.services.runtime.deployment()'s
      # fallback signal for "this is systemd" when the new explicit
      # JEN_SERVICE_MANAGER= line isn't there to read (a unit rendered
      # before this release, or a hand-written one from
      # docs/manual-install.md): systemd sets INVOCATION_ID for every
      # unit it starts. Verify that's actually true on a real run.py ->
      # gunicorn exec chain before trusting it anywhere else below.
      - name: Verify INVOCATION_ID survives run.py's exec into gunicorn
        run: |
          set -e
          pid=$(systemctl show jen -p MainPID --value)
          [[ "$pid" != "0" ]]
          # the redirect itself opens the fd as the UNPRIVILEGED shell —
          # sudo has to wrap that open too, not just `tr`, since
          # /proc/<pid>/environ is only readable by its own owner
          # (www-data) or root.
          proc_env=$(sudo sh -c "tr '\\0' '\\n' < /proc/$pid/environ")
          grep -q '^INVOCATION_ID=' <<< "$proc_env"
          echo "INVOCATION_ID present in the running gunicorn worker's own environment"

      # v5.67.0-beta.6 (Q118) — the install CI job never opened a single
      # page before this: every unit test monkeypatches is_systemd_host(),
      # so nothing ever proved the REAL rendered page, on a REAL systemd
      # host, actually shows the systemd controls rather than the Docker
      # wording Q114's own JEN_ROOT=... unit line had been silently
      # triggering since 5.67.0-beta.2.
      - name: Assert Settings -> System and the plugin manager know this is systemd
        run: |
          set -e
          cookie="$RUNNER_TEMP/cookies.txt"
          system_page=$(curl -sb "$cookie" -c "$cookie" http://127.0.0.1:5050/settings/system)
          grep -q 'Update Now' <<< "$system_page"
          grep -q 'data-confirm="Restart Jen now?"' <<< "$system_page"
          if grep -q "container image.s job" <<< "$system_page"; then
            echo "::error::Settings -> System shows the Docker 'container image's job' wording"; exit 1
          fi
          if grep -q 'Restart the container to restart Jen' <<< "$system_page"; then
            echo "::error::Settings -> System shows the Docker restart wording"; exit 1
          fi
          echo "Settings -> System shows the real Update/Restart controls, no Docker wording"

          plugins_page=$(curl -sb "$cookie" -c "$cookie" http://127.0.0.1:5050/settings/plugins)
          grep -q 'root-privileged service' <<< "$plugins_page"
          if grep -q 'Installed plugins live in' <<< "$plugins_page"; then
            echo "::error::the plugin manager shows the Docker/legacy install-path wording"; exit 1
          fi
          echo "plugin manager shows the root-managed install path"

          update_status=$(curl -sb "$cookie" -c "$cookie" http://127.0.0.1:5050/settings/infrastructure/update-status)
          grep -q 'active_state' <<< "$update_status"
          echo "update-status endpoint answers"

      - name: Uninstall
        working-directory: ${{ runner.temp }}/install-head/jen
        run: printf 'y\n1\n' | sudo ./uninstall.sh

      # (the upgrade-from-the-latest-stable legs that used to sit between a first
      # install and this uninstall are their own job now: upgrade-from-stable)
      - name: Assert uninstall left what docs/installation.md promises
        run: |
          set -e
          [[ ! -d /opt/jen ]]
          [[ ! -f /etc/systemd/system/jen.service ]]
          [[ ! -f /etc/sudoers.d/jen ]]
          sudo test -f /etc/jen/jen.config
          sudo test -d /etc/jen/ssl
          sudo test -d /etc/jen/ssh
          sudo test -d /var/lib/jen
          echo "app + service + sudoers removed; config, SSL, SSH and content preserved"

      # v5.67.0 (Q114) — the same fresh-install/upgrade/uninstall cycle
      # again, this time with --app-dir/--config-dir/--data-dir, reusing
      # this job's already-running Kea/MariaDB rather than a second job
      # (which would just re-pay their startup cost). Ports are reused
      # from the legs above — each one's own uninstall already stopped
      # the service before this starts.
      #
      # The level-1 uninstalls above intentionally preserve
      # /etc/jen-layout.conf (same as jen.config/content — "detected
      # automatically" on a reinstall), so one is still sitting there
      # recording app_dir=/opt/jen from the very first leg's fresh
      # install. This leg means a genuinely fresh, clean box — the
      # caught-by-this-same-leg's-first-real-run bug was install.sh
      # correctly refusing to relocate an "existing" install over it.
      - name: Clear the leftover layout record from the legs above
        run: sudo rm -f /etc/jen-layout.conf

      - name: Fresh install with a relocated layout
        run: |
          mkdir -p "$RUNNER_TEMP/install-relocated"
          tar xzf dist/jen-head.tar.gz -C "$RUNNER_TEMP/install-relocated"
          cd "$RUNNER_TEMP/install-relocated/jen"
          sudo TERM=linux ./install.sh --answers "$RUNNER_TEMP/answers.env" --unattended \
            --app-dir /srv/jen/app --config-dir /srv/jen/etc --data-dir /srv/jen/data \
            2>&1 | tee "$RUNNER_TEMP/relocated-install.log"

      - name: Assert the relocated install is real
        run: |
          set -e
          systemctl is-active --quiet jen
          grep -q jen_version < <(curl -sf http://127.0.0.1:5050/api/v1/health)
          echo "relocated service healthy"

          [[ "$(sudo stat -c '%U:%G' /srv/jen/app/current/app/run.py)" == "root:root" ]]
          sudo -u www-data test ! -w /srv/jen/app/current/app/run.py
          echo "relocated app tree root-owned, not writable by the service user"

          [[ "$(sudo stat -c '%a' /srv/jen/etc/jen.config)" == "600" ]]
          [[ "$(sudo stat -c '%U:%G' /srv/jen/etc/jen.config)" == "www-data:www-data" ]]
          echo "relocated jen.config is 0600, service-owned"

          [[ "$(sudo stat -c '%U:%a' /etc/jen-layout.conf)" == "root:644" ]]
          sudo grep -q '^app_dir = /srv/jen/app$' /etc/jen-layout.conf
          sudo grep -q '^config_dir = /srv/jen/etc$' /etc/jen-layout.conf
          sudo grep -q '^data_dir = /srv/jen/data$' /etc/jen-layout.conf
          echo "layout file recorded root:root 0644 with the chosen paths"

          env=$(systemctl show jen -p Environment --value)
          grep -q 'JEN_CONFIG_DIR=/srv/jen/etc' <<< "$env"
          grep -q 'JEN_CONTENT_DIR=/srv/jen/data' <<< "$env"
          grep -q 'JEN_ROOT=/srv/jen/app/current/app' <<< "$env"
          # v5.67.0-beta.6 (Q118) — JEN_ROOT above is set here on a
          # relocated install exactly like it is on the default layout,
          # which is the whole reason jen.services.runtime.deployment()
          # cannot read it; JEN_SERVICE_MANAGER is the explicit signal
          # that survives rendering regardless of where app_dir lives.
          grep -q 'JEN_SERVICE_MANAGER=systemd' <<< "$env"
          echo "rendered unit's Environment= matches the relocated layout"

          [[ ! -e /opt/jen ]]
          echo "nothing landed at the historical default app_dir"

      # v5.67.0-beta.6 (Q118) — the relocated-layout leg is the one most
      # likely to have been affected by the bug this Q fixes (it sets
      # JEN_ROOT to a path that doesn't even look like the historical
      # default), so it gets its own page-level proof too, not just the
      # Environment= grep above.
      - name: Assert Settings -> System knows this is systemd on a relocated install
        run: |
          set -e
          cookie="$RUNNER_TEMP/cookies-relocated.txt"
          csrf=$(curl -sc "$cookie" http://127.0.0.1:5050/login | grep -m1 -oP 'name="csrf_token" value="\K[^"]+')
          curl -sb "$cookie" -c "$cookie" -X POST http://127.0.0.1:5050/login \
            -d "username=admin&password=ci-test-passw0rd-!&csrf_token=$csrf" -o /dev/null
          system_page=$(curl -sb "$cookie" -c "$cookie" http://127.0.0.1:5050/settings/system)
          grep -q 'Update Now' <<< "$system_page"
          if grep -q "container image.s job" <<< "$system_page"; then
            echo "::error::Settings -> System shows the Docker 'container image's job' wording"; exit 1
          fi
          echo "relocated install: Settings -> System shows the real Update control, no Docker wording"

      # v5.67.0-beta.5 (Q117, item d) — the behavioral half of the fix:
      # install.sh's [kea_ssh] key_path and its SSL-summary check, plus
      # three jen-update-root.py log lines, hardcoded /etc/jen or
      # /opt/jen regardless of where the install actually lives. Four
      # real sources, grepped for the three literal defaults — a
      # commented reference to the always-fixed /etc/jen-layout.conf
      # (in the rendered unit's own template comments) is the one
      # expected, excluded match.
      - name: Assert no hardcoded layout literal leaked into the relocated install
        run: |
          set -e
          fail=0
          # (?<![\w/]) — a real standalone reference, not a substring
          # inside a larger path: this leg's own --config-dir /srv/jen/etc
          # makes the GENERATED config's own path /srv/jen/etc/jen.config,
          # which otherwise self-matches "/etc/jen" in its middle.
          pattern='(?<![\w/])/etc/jen(?!-layout\.conf)|(?<![\w/])/opt/jen|(?<![\w/])/var/lib/jen'
          check() {
              local label="$1" file="$2" hits
              [[ -f "$file" ]] || return 0
              # comment lines out, then look — no pipeline, so no SIGPIPE and no masked status
              hits=$(sudo grep -Pv '^\s*#' "$file" | grep -P "$pattern" || true)
              if [[ -n "$hits" ]]; then
                  echo "::error::$label ($file) contains a hardcoded layout literal"
                  echo "$hits"
                  fail=1
              fi
          }
          check "generated jen.config"   /srv/jen/etc/jen.config
          check "rendered unit"          /etc/systemd/system/jen.service
          check "install run's own summary" "$RUNNER_TEMP/relocated-install.log"
          # (jen-update.service's journal used to be checked here too: nothing in
          # this job ever starts that unit, so it was always empty — the real hop
          # now runs in the upgrade-from-stable job)
          [[ $fail -eq 0 ]]
          echo "no hardcoded /etc/jen, /opt/jen or /var/lib/jen in any generated artifact"

      - name: Upgrade the relocated install in place
        working-directory: ${{ runner.temp }}/install-relocated/jen
        run: sudo TERM=linux ./install.sh --unattended

      - name: Assert the relocated upgrade is healthy
        run: |
          set -e
          systemctl is-active --quiet jen
          grep -q jen_version < <(curl -sf http://127.0.0.1:5050/api/v1/health)
          sudo grep -q '10.99.0.0/24' /srv/jen/etc/jen.config
          echo "relocated upgrade healthy, config preserved"

      - name: Uninstall the relocated install
        working-directory: ${{ runner.temp }}/install-relocated/jen
        run: printf 'y\n1\n' | sudo ./uninstall.sh

      - name: Assert relocated uninstall left what it should
        run: |
          set -e
          [[ ! -d /srv/jen/app ]]
          [[ ! -f /etc/systemd/system/jen.service ]]
          sudo test -f /srv/jen/etc/jen.config
          sudo test -d /srv/jen/data
          sudo test -f /etc/jen-layout.conf
          echo "relocated app removed; config/data/layout-record preserved (level 1)"

      # v5.67.0 (Q115 step 3) — install.sh no longer asks for Kea's API,
      # database, subnets, SSH, or DDNS interactively (jen/setup now
      # does that, live, after first login); an answers file that leaves
      # all of those keys out must still produce a healthy install whose
      # first superadmin login lands on /setup instead of the dashboard.
      #
      # v5.67.0-beta.9 (Q121, item c) — this leg now has to START FROM A BOX
      # WITH NO CONFIG: the level-1 uninstalls above keep /etc/jen/jen.config
      # (Kea configured, from the first leg), and install.sh now KEEPS an
      # existing config on a reinstall instead of rewriting it from the answers
      # file — which is the fix, and is what made this leg's premise (a Kea-less
      # config) stop being true by accident. The Jen database, and so the admin
      # account, are deliberately left alone.
      - name: Clear the leftover layout record, config and content from the legs above
        run: sudo rm -rf /etc/jen /var/lib/jen /etc/jen-layout.conf

      - name: Write an answers file with no Kea keys at all
        # v5.67.0 (Q115 step 3 fixup 6) — no JEN_INITIAL_ADMIN_PASSWORD
        # here: the jen database this whole job shares was created once at
        # the very top and is never dropped between legs (only install.sh's
        # own app tree gets reinstalled), so the admin row the FIRST leg's
        # answers file seeded is still the only one in `users` — Jen's own
        # seeding (jen/models/db.py::init_jen_db) is "if no users exist",
        # by design, so a second JEN_INITIAL_ADMIN_PASSWORD here would be
        # silently ignored. Logging in below with that first leg's own
        # ci-test-passw0rd-! is correct, not a workaround.
        run: |
          umask 077
          cat > "$RUNNER_TEMP/answers-no-kea.env" << 'EOF'
          JEN_DB_HOST=127.0.0.1
          JEN_DB_USER=jen
          JEN_DB_PASS=jen_pw
          JEN_DB_NAME=jen
          JEN_HTTP_PORT=5050
          JEN_HTTPS_PORT=8443
          EOF

      - name: Fresh install from the no-Kea answers file
        run: |
          mkdir -p "$RUNNER_TEMP/install-no-kea"
          tar xzf dist/jen-head.tar.gz -C "$RUNNER_TEMP/install-no-kea"
          cd "$RUNNER_TEMP/install-no-kea/jen"
          sudo TERM=linux ./install.sh --answers "$RUNNER_TEMP/answers-no-kea.env" --unattended

      - name: Assert a Kea-less install lands a fresh superadmin on /setup
        run: |
          set -e
          systemctl is-active --quiet jen
          grep -q jen_version < <(curl -sf http://127.0.0.1:5050/api/v1/health)
          echo "Kea-less install is healthy"

          cookie="$RUNNER_TEMP/cookies-no-kea.txt"
          csrf=$(curl -sc "$cookie" http://127.0.0.1:5050/login | grep -m1 -oP 'name="csrf_token" value="\K[^"]+')
          [[ -n "$csrf" ]]
          login_location=$(curl -sb "$cookie" -c "$cookie" -X POST http://127.0.0.1:5050/login \
            -d "username=admin&password=ci-test-passw0rd-!&csrf_token=$csrf" \
            -o /dev/null -w '%{redirect_url}')
          echo "login redirected to: $login_location"
          # %{redirect_url} is already an absolute URL (http://127.0.0.1:5050/),
          # not a path — curl it directly rather than re-prefixing the host.
          dashboard_location=$(curl -sb "$cookie" -c "$cookie" "$login_location" \
            -o /dev/null -w '%{redirect_url}')
          echo "dashboard redirected to: $dashboard_location"
          [[ "$dashboard_location" == *"/setup"* ]]
          echo "a fresh, Kea-less superadmin lands on /setup"

      - name: Uninstall the no-Kea install
        working-directory: ${{ runner.temp }}/install-no-kea/jen
        run: printf 'y\n1\n' | sudo ./uninstall.sh

      # ─────────────────────────────────────────────────────────────────────
      # v5.67.0-beta.9 (Q121) — the installer's remaining defects, each proved
      # by running the REAL script on this runner. Every leg below starts from
      # a box with no Jen on it (the level-1 uninstalls above keep config,
      # content and the layout record on purpose).
      # ─────────────────────────────────────────────────────────────────────
      - name: Q121 reset — a box with no Jen on it
        run: |
          set -e
          sudo systemctl stop jen 2>/dev/null || true
          sudo rm -rf /etc/jen /var/lib/jen /opt/jen /srv/jen /srv/q121 /etc/jen-layout.conf
          sudo rm -f /etc/systemd/system/jen.service /etc/sudoers.d/jen
          sudo systemctl daemon-reload

      # (a) — JEN_APP_DIR/JEN_CONFIG_DIR/JEN_DATA_DIR in an --answers file,
      # with NO flag at all. The layout used to be resolved at the top of the
      # script, before the answers file was read, so this installed to
      # /opt/jen and recorded the defaults.
      - name: Q121 (a) — relocate through the answers file alone
        run: |
          set -e
          umask 077
          cp "$RUNNER_TEMP/answers.env" "$RUNNER_TEMP/answers-relocate.env"
          {
            echo "JEN_APP_DIR=/srv/q121/ans/app"
            echo "JEN_CONFIG_DIR=/srv/q121/ans/etc"
            echo "JEN_DATA_DIR=/srv/q121/ans/data"
          } >> "$RUNNER_TEMP/answers-relocate.env"
          cd "$RUNNER_TEMP/install-head/jen"
          sudo TERM=linux ./install.sh --answers "$RUNNER_TEMP/answers-relocate.env" --unattended

      - name: Q121 (a) — assert it went where the answers file said
        run: |
          set -e
          systemctl is-active --quiet jen
          grep -q jen_version < <(curl -sf http://127.0.0.1:5050/api/v1/health)
          sudo grep -q '^app_dir = /srv/q121/ans/app$' /etc/jen-layout.conf
          sudo grep -q '^config_dir = /srv/q121/ans/etc$' /etc/jen-layout.conf
          sudo grep -q '^data_dir = /srv/q121/ans/data$' /etc/jen-layout.conf
          sudo test -f /srv/q121/ans/app/current/app/run.py
          sudo test -f /srv/q121/ans/etc/jen.config
          [[ ! -e /opt/jen && ! -e /etc/jen && ! -e /var/lib/jen ]]
          echo "the answers file's own layout keys were honoured, and nothing landed at the defaults"

      - name: Q121 (a) — put the box back
        run: |
          set -e
          cd "$RUNNER_TEMP/install-head/jen"
          printf 'y\n1\n' | sudo ./uninstall.sh
          sudo rm -rf /srv/q121 /etc/jen-layout.conf

      # (b) — install versus upgrade is the checker's decision, not "does the
      # directory exist". A pre-created EMPTY --app-dir is allowed by the
      # contract and used to be refused as "relocating an existing install".
      - name: Q121 (b) — a pre-created empty app dir is a fresh install
        run: |
          set -e
          sudo mkdir -p /srv/q121/b/empty-app
          cd "$RUNNER_TEMP/install-head/jen"
          sudo TERM=linux ./install.sh --answers "$RUNNER_TEMP/answers.env" --unattended \
            --app-dir /srv/q121/b/empty-app --config-dir /srv/q121/b/etc --data-dir /srv/q121/b/data
          systemctl is-active --quiet jen
          sudo test -f /srv/q121/b/empty-app/current/app/run.py
          sudo grep -q '^app_dir = /srv/q121/b/empty-app$' /etc/jen-layout.conf
          echo "an empty, pre-created --app-dir installed cleanly"
          printf 'y\n1\n' | sudo ./uninstall.sh
          sudo rm -rf /srv/q121 /etc/jen-layout.conf

      # …and a directory with somebody else's files in it, with no layout
      # file, used to be treated as an UPGRADE: tolerated, then chowned and
      # stamped. It is refused now, and not touched.
      - name: Q121 (b) — somebody else's directory is refused and left alone
        run: |
          set -e
          sudo mkdir -p /srv/q121/foreign
          echo "not jen" | sudo tee /srv/q121/foreign/their-file >/dev/null
          before=$(sudo stat -c '%U:%G %a' /srv/q121/foreign /srv/q121/foreign/their-file)
          cd "$RUNNER_TEMP/install-head/jen"
          set +e
          out=$(sudo TERM=linux ./install.sh --answers "$RUNNER_TEMP/answers.env" --unattended \
            --app-dir /srv/q121/foreign --config-dir /srv/q121/fe --data-dir /srv/q121/fd 2>&1)
          rc=$?
          set -e
          echo "$out" | tail -5
          [[ $rc -ne 0 ]]
          grep -q "does not carry Jen's own marker" <<< "$out"
          after=$(sudo stat -c '%U:%G %a' /srv/q121/foreign /srv/q121/foreign/their-file)
          [[ "$before" == "$after" ]]
          sudo test ! -e /srv/q121/foreign/.jen-directory
          sudo test ! -e /srv/q121/foreign/releases
          sudo test ! -e /etc/jen-layout.conf
          sudo test ! -e /srv/q121/fe
          echo "refused, ownership/mode unchanged, no marker, no release tree, no layout record"
          sudo rm -rf /srv/q121

      # (c) — reinstall after an app-only uninstall (uninstall.sh level 1,
      # which promises "your existing config will be detected
      # automatically"). collect_config used to rewrite jen.config from blank
      # Kea sections, and a box whose uninstall predated markers refused its
      # own config directory as "not empty and unmarked".
      - name: Q121 (c) — fresh install, with a sentinel in the config
        run: |
          set -e
          cd "$RUNNER_TEMP/install-head/jen"
          sudo TERM=linux ./install.sh --answers "$RUNNER_TEMP/answers.env" --unattended
          sudo sh -c "echo '# ci-sentinel: this config must survive a reinstall' >> /etc/jen/jen.config"
          sudo grep -q 'ci-sentinel' /etc/jen/jen.config

      - name: Q121 (c) — reinstall onto the kept config (layout record present)
        run: |
          set -e
          cd "$RUNNER_TEMP/install-head/jen"
          printf 'y\n1\n' | sudo ./uninstall.sh
          sudo test ! -e /opt/jen
          sudo test -f /etc/jen/jen.config
          # no answers file, no config prompts: the kept config is detected and used
          sudo TERM=linux ./install.sh --unattended
          systemctl is-active --quiet jen
          grep -q jen_version < <(curl -sf http://127.0.0.1:5050/api/v1/health)
          sudo grep -q 'ci-sentinel' /etc/jen/jen.config
          sudo grep -q '^api_url  = http://127.0.0.1:8004$' /etc/jen/jen.config
          echo "the existing jen.config was kept, not rewritten from blank Kea sections"

      - name: Q121 (c) — reinstall onto a config and data dir that predate markers
        run: |
          set -e
          cd "$RUNNER_TEMP/install-head/jen"
          printf 'y\n1\n' | sudo ./uninstall.sh
          # a box whose uninstall predates 5.67: no layout record, no markers anywhere
          sudo rm -f /etc/jen-layout.conf /etc/jen/.jen-directory /var/lib/jen/.jen-directory
          sudo TERM=linux ./install.sh --unattended
          systemctl is-active --quiet jen
          sudo grep -q 'ci-sentinel' /etc/jen/jen.config
          sudo test -f /etc/jen/.jen-directory
          sudo test -f /var/lib/jen/.jen-directory
          sudo test -f /etc/jen-layout.conf
          echo "config and data were recognised by content and re-stamped"
          printf 'y\n1\n' | sudo ./uninstall.sh
          sudo rm -rf /etc/jen /var/lib/jen /etc/jen-layout.conf

      # (d) — which checker uninstall.sh asks, and what level 3 removes. The
      # INSTALLED updater used to be preferred, and a 5.66.0 copy (or a rollback
      # to one) rejects --check-layout with "unrecognized arguments": the stub
      # below behaves exactly that way.
      - name: Q121 (d) — fresh install, then an installed updater that predates --check-layout
        run: |
          set -e
          sudo rm -rf /etc/jen /var/lib/jen /opt/jen /etc/jen-layout.conf
          cd "$RUNNER_TEMP/install-head/jen"
          sudo TERM=linux ./install.sh --answers "$RUNNER_TEMP/answers.env" --unattended
          cat > "$RUNNER_TEMP/old-updater.py" << 'EOF'
          #!/usr/bin/env python3
          import sys
          print("ERROR: unrecognized arguments %r - refusing." % (sys.argv[1:],))
          sys.exit(1)
          EOF
          sudo install -m 700 -o root -g root "$RUNNER_TEMP/old-updater.py" /usr/local/sbin/jen-update-root.py
          # (`! cmd` is exempt from set -e in bash, so the negation is spelled out)
          if sudo python3 /usr/local/sbin/jen-update-root.py --check-layout --help; then
            echo "::error::the stub updater accepted --check-layout --help"; exit 1
          fi
          echo "the installed updater now rejects --check-layout, as a 5.66.0 one does"

      - name: Q121 (d) — uninstall from the tarball uses the copy beside the script
        run: |
          set -e
          cd "$RUNNER_TEMP/install-head/jen"
          printf 'y\n1\n' | sudo ./uninstall.sh
          sudo test ! -e /opt/jen
          echo "uninstalled with the stale updater still installed"

      - name: Q121 (d) — a lone uninstall.sh with only a stale updater refuses clearly and removes nothing
        run: |
          set -e
          cd "$RUNNER_TEMP/install-head/jen"
          sudo TERM=linux ./install.sh --unattended
          sudo install -m 700 -o root -g root "$RUNNER_TEMP/old-updater.py" /usr/local/sbin/jen-update-root.py
          mkdir -p "$RUNNER_TEMP/lone"
          cp uninstall.sh "$RUNNER_TEMP/lone/"
          set +e
          out=$(printf 'y\n1\n' | sudo "$RUNNER_TEMP/lone/uninstall.sh" 2>&1)
          rc=$?
          set -e
          echo "$out" | tail -4
          [[ $rc -ne 0 ]]
          grep -q "predates --check-layout" <<< "$out"
          sudo test -d /opt/jen
          echo "refused with a clear message; nothing was removed"

      - name: Q121 (d) — a lone uninstall.sh with a current installed updater works, and level 3 removes it and both units
        run: |
          set -e
          sudo install -m 700 -o root -g root "$RUNNER_TEMP/install-head/jen/jen-update-root.py" /usr/local/sbin/jen-update-root.py
          checker_help=$(sudo python3 /usr/local/sbin/jen-update-root.py --check-layout --help)
          grep -q -- '--check-layout' <<< "$checker_help"
          sudo test -f /etc/systemd/system/jen-update.service
          sudo test -f /etc/systemd/system/jen-plugin-install.service
          printf 'y\n3\nDELETE\n' | sudo "$RUNNER_TEMP/lone/uninstall.sh"
          sudo test ! -e /opt/jen
          sudo test ! -e /etc/jen
          sudo test ! -e /var/lib/jen
          sudo test ! -e /etc/jen-layout.conf
          sudo test ! -e /usr/local/sbin/jen-update-root.py
          sudo test ! -e /etc/systemd/system/jen-update.service
          sudo test ! -e /etc/systemd/system/jen-plugin-install.service
          echo "level 3 removed the app, config, content, layout record, the root updater and both oneshot units"

      # The whole life cycle on a relocated layout — fresh install, an
      # INTERACTIVE in-place upgrade (with the pre-upgrade backup), --repair, and
      # uninstall.sh at every level — asserting at each step that NOTHING was
      # created under /opt/jen, /etc/jen or /var/lib/jen. Every path in the
      # rendered unit, the SSH key directory and the backup directory must be
      # under the layout that was chosen.
      - name: Q121 life cycle — a clean box, then a fresh relocated install
        run: |
          set -e
          sudo rm -rf /etc/jen /var/lib/jen /opt/jen /srv/q121 /etc/jen-layout.conf
          [[ ! -e /opt/jen && ! -e /etc/jen && ! -e /var/lib/jen ]]
          cd "$RUNNER_TEMP/install-head/jen"
          sudo TERM=linux ./install.sh --answers "$RUNNER_TEMP/answers.env" --unattended \
            --app-dir /srv/q121/life/app --config-dir /srv/q121/life/etc --data-dir /srv/q121/life/data

      - name: Q121 life cycle — everything is under the chosen layout
        run: |
          set -e
          systemctl is-active --quiet jen
          grep -q jen_version < <(curl -sf http://127.0.0.1:5050/api/v1/health)
          sudo test -f /srv/q121/life/app/current/app/run.py
          sudo test -f /srv/q121/life/etc/jen.config
          sudo test -d /srv/q121/life/etc/ssh
          sudo test -d /srv/q121/life/etc/ssl
          sudo test -d /srv/q121/life/data/backups
          unit=$(cat /etc/systemd/system/jen.service)
          grep -q '/srv/q121/life/app' <<< "$unit"
          grep -q '/srv/q121/life/etc' <<< "$unit"
          grep -q '/srv/q121/life/data' <<< "$unit"
          [[ ! -e /opt/jen && ! -e /etc/jen && ! -e /var/lib/jen ]]
          echo "app, config, SSH/SSL directories, backup directory and every unit path are under the chosen layout; nothing at the defaults"

      - name: Q121 life cycle — an interactive in-place upgrade writes a real pre-upgrade backup
        run: |
          set -e
          cd "$RUNNER_TEMP/install-head/jen"
          # the prompts, in order: "Upgrade to ...?", "Create a database backup ...?", "Existing config found" -> 1
          printf 'y\ny\n1\n' > "$RUNNER_TEMP/upgrade-input.txt"
          # no `| tee`: this step's shell has no pipefail, so a failed install would be masked by it
          script -qec "sudo TERM=linux ./install.sh" /dev/null < "$RUNNER_TEMP/upgrade-input.txt" > "$RUNNER_TEMP/upgrade.log"
          cat "$RUNNER_TEMP/upgrade.log"
          grep -q "Jen's database backed up" "$RUNNER_TEMP/upgrade.log"
          if grep -q "NO backup was written" "$RUNNER_TEMP/upgrade.log"; then
            echo "::error::the upgrade reported that no backup was written"; exit 1
          fi
          backup=$(sudo find /srv/q121/life/data/backups -name 'jen-pre-upgrade-*.json.gz' -print -quit)
          [[ -n "$backup" ]]
          sudo test -f "${backup%.json.gz}.meta.json"
          [[ "$(sudo stat -c '%U:%a' "$backup")" == "www-data:600" ]]
          sudo python3 - "$backup" << 'EOF'
          import gzip, json, sys
          doc = json.load(gzip.open(sys.argv[1], "rt", encoding="utf-8"))
          assert "users" in doc["data"] and doc["data"]["users"], "the users table is in the backup and not empty"
          assert doc["_meta"]["database"] == "jen"
          assert "users" in doc["_meta"]["tables"]
          print("backup is a valid Jen export with", len(doc["data"]), "tables")
          EOF
          systemctl is-active --quiet jen
          [[ ! -e /opt/jen && ! -e /etc/jen && ! -e /var/lib/jen ]]

      - name: Q121 life cycle — --repair
        run: |
          set -e
          cd "$RUNNER_TEMP/install-head/jen"
          sudo TERM=linux ./install.sh --repair
          systemctl is-active --quiet jen
          grep -q jen_version < <(curl -sf http://127.0.0.1:5050/api/v1/health)
          [[ ! -e /opt/jen && ! -e /etc/jen && ! -e /var/lib/jen ]]

      - name: Q121 life cycle — uninstall level 1, then a reinstall onto the kept layout and config
        run: |
          set -e
          cd "$RUNNER_TEMP/install-head/jen"
          printf 'y\n1\n' | sudo ./uninstall.sh
          sudo test ! -e /srv/q121/life/app
          sudo test -f /srv/q121/life/etc/jen.config
          sudo test -d /srv/q121/life/data
          sudo test -f /etc/jen-layout.conf
          [[ ! -e /opt/jen && ! -e /etc/jen && ! -e /var/lib/jen ]]
          sudo TERM=linux ./install.sh --unattended
          systemctl is-active --quiet jen
          sudo grep -q '^app_dir = /srv/q121/life/app$' /etc/jen-layout.conf
          [[ ! -e /opt/jen && ! -e /etc/jen && ! -e /var/lib/jen ]]

      - name: Q121 life cycle — uninstall level 2 keeps certs, keys and content, removes jen.config
        run: |
          set -e
          cd "$RUNNER_TEMP/install-head/jen"
          printf 'y\n2\n' | sudo ./uninstall.sh
          sudo test ! -e /srv/q121/life/app
          sudo test ! -e /srv/q121/life/etc/jen.config
          sudo sh -c 'ls /srv/q121/life/etc/jen.config.removed.*' >/dev/null
          sudo test -d /srv/q121/life/etc/ssh
          sudo test -d /srv/q121/life/etc/ssl
          sudo test -d /srv/q121/life/data/backups
          [[ ! -e /opt/jen && ! -e /etc/jen && ! -e /var/lib/jen ]]

      - name: Q121 life cycle — reinstall from the answers file (no config left), then level 3
        run: |
          set -e
          cd "$RUNNER_TEMP/install-head/jen"
          sudo TERM=linux ./install.sh --answers "$RUNNER_TEMP/answers.env" --unattended
          systemctl is-active --quiet jen
          sudo test -f /srv/q121/life/etc/jen.config
          [[ ! -e /opt/jen && ! -e /etc/jen && ! -e /var/lib/jen ]]
          printf 'y\n3\nDELETE\n' | sudo ./uninstall.sh
          sudo test ! -e /srv/q121/life/app
          sudo test ! -e /srv/q121/life/etc
          sudo test ! -e /srv/q121/life/data
          sudo test ! -e /etc/jen-layout.conf
          [[ ! -e /opt/jen && ! -e /etc/jen && ! -e /var/lib/jen ]]
          echo "the whole life cycle ran on /srv/q121/life and never created anything under the default paths"
          sudo rm -rf /srv/q121

      - name: Kea log on failure
        if: failure()
        run: docker logs kea 2>&1 | tail -100 || true

      - name: Jen service log on failure
        if: failure()
        run: sudo journalctl -u jen -n 200 --no-pager || true

  # v5.67.0-beta.10 (Q122) — the upgrade every operator is about to make, as
  # its own job on a CLEAN runner. It used to be a leg of the install job,
  # running AFTER HEAD's own fresh install and a level-1 uninstall: it started
  # with HEAD's migrated database, HEAD's markers and layout file and HEAD's
  # updater, fed a prompt script written for v5.66.0 to whatever "latest"
  # happened to be, and swallowed any failure of the stable installer with
  # `|| echo`. Now:
  #   * the stable release is PINNED (JEN_STABLE_VERSION, top of this file;
  #     moved in the first release commit after a promotion — CLAUDE.md
  #     "Release channels", step 4) and its signature is checked against the
  #     key pinned in THIS repo, not one extracted from the tarball under test;
  #   * nothing is masked: the one known failure of the stable installer is
  #     accepted by its exact shape, and everything else fails the job;
  #   * the health check compares the VALUE of jen_version, before and after;
  #   * two ways up, each on its own runner (matrix `via`):
  #       installer — HEAD's install.sh over the stable box (what the README
  #                   tells an operator to do);
  #       updater   — the STABLE release's OWN jen-update-root.py, the code that
  #                   really runs when someone presses Update now, driven
  #                   through the hop onto HEAD's tree by tools/ci_updater_hop.py
  #                   (the download/signature seams stood in for, named there),
  #                   then HEAD's updater for a second hop.
  upgrade-from-stable:
    name: upgrade from stable (${{ matrix.os }}, via ${{ matrix.via }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            via: installer
          - os: ubuntu-24.04
            via: installer
          - os: ubuntu-22.04
            via: updater
          - os: ubuntu-24.04
            via: updater

    env:
      JEN_ROOT: ${{ github.workspace }}
      KEA_IMAGE: docker.cloudsmith.io/isc/docker/kea-dhcp4:3.2.0
      ADMIN_PASSWORD: ci-test-passw0rd-!

    services:
      database:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: kea
          MYSQL_USER: kea
          MYSQL_PASSWORD: kea_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -pci_root_pw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # The hosted images ship /opt mode 777; see the install job's own note.
      - name: Harden /opt for this runner
        run: sudo chmod 755 /opt

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies (for the Kea config generator)
        run: pip install -q -r requirements.txt

      - name: Jen's database, Kea's schema and a real kea-dhcp4
        uses: ./.github/actions/kea-fixture
        with:
          kea-image: ${{ env.KEA_IMAGE }}

      - name: Build this commit's tarball
        run: |
          mkdir -p dist
          git archive --format=tar --prefix=jen/ HEAD | gzip -9 > dist/jen-head.tar.gz
          head_version=$(sed -n 's/^JEN_VERSION = "\(.*\)"$/\1/p' jen/__init__.py)
          [[ -n "$head_version" ]]
          echo "HEAD_VERSION=$head_version" >> "$GITHUB_ENV"
          echo "HEAD is $head_version; the stable release under test is $JEN_STABLE_VERSION"

      - name: Fetch the pinned stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/stable"
          gh release download "v${JEN_STABLE_VERSION}" --repo "${{ github.repository }}" \
            --pattern 'jen-v*.tar.gz' --pattern 'SHA256SUMS*' --dir "$RUNNER_TEMP/stable"
          ls -lh "$RUNNER_TEMP/stable"
          test -f "$RUNNER_TEMP/stable/jen-v${JEN_STABLE_VERSION}.tar.gz"

      # The signers are the key pinned in THIS repo (the same RELEASE_SIGNERS
      # line the updater and the helper carry) — not extracted from the tarball
      # being verified, which would let a forged release vouch for itself.
      - name: Verify the stable release's signature against the repo's pinned key
        run: |
          signers_line="$(sed -n 's/^RELEASE_SIGNERS = "\(.*\)"$/\1/p' jen-update-root.py)"
          [[ -n "$signers_line" ]]
          cd "$RUNNER_TEMP/stable"
          printf '%s\n' "$signers_line" > allowed_signers
          ssh-keygen -Y verify -f allowed_signers -I release@jen -n jen-release \
            -s SHA256SUMS.sig < SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          echo "v${JEN_STABLE_VERSION} verified."

      # v5.66.0 is immutable, already-tagged code that predates --answers
      # entirely, and --unattended there only resolves prompts to their
      # DEFAULTS (useless placeholder hosts, not this job's real services). So
      # this leg drives the full original wizard through a real pty, answering
      # every prompt in the order v5.66.0's collect_config() asks them
      # (confirmed against `git show v5.66.0:install.sh`): install type, Kea API
      # URL/user/pass, Kea DB host/user/pass/name, Jen DB host/user/pass/name,
      # admin password (+ confirm), one subnet (id/name/CIDR) then Enter, SSH
      # y/n, DDNS y/n, HTTP/HTTPS ports. TERM=linux sidesteps the clear/terminfo
      # bug that same code has.
      #
      # NOTHING IS MASKED. v5.66.0's verify_install() carries a bug fixed since
      # (a stale Jinja filter list, then a `$?` after an assignment under
      # set -e), so its installer exits non-zero AFTER the service is up and the
      # config is written, right after printing "Config file present". That
      # exact shape — and only that — is accepted below; any other failure, or
      # that failure without the service running, fails the job.
      - name: Fresh install of the pinned stable release
        run: |
          mkdir -p "$RUNNER_TEMP/install-stable"
          tar xzf "$RUNNER_TEMP/stable/jen-v${JEN_STABLE_VERSION}.tar.gz" -C "$RUNNER_TEMP/install-stable"
          cd "$RUNNER_TEMP/install-stable/jen"
          cat > "$RUNNER_TEMP/stable-wizard-input.txt" << 'WIZARD'
          1
          http://127.0.0.1:8004
          jen
          jen_api_pw
          127.0.0.1
          kea
          kea_pw
          kea
          127.0.0.1
          jen
          jen_pw
          jen
          ci-test-passw0rd-!
          ci-test-passw0rd-!
          1
          Test
          10.99.0.0/24

          n
          n
          5050
          8443
          WIZARD
          set +e
          script -qec "sudo TERM=linux ./install.sh" /dev/null < "$RUNNER_TEMP/stable-wizard-input.txt" > "$RUNNER_TEMP/stable-install.log"
          rc=$?
          set -e
          tail -25 "$RUNNER_TEMP/stable-install.log"
          if [[ $rc -ne 0 ]]; then
            # the one known shape: died right after "Config file present", with no FATAL/FAIL line anywhere
            if grep -q "FATAL\|FAIL" "$RUNNER_TEMP/stable-install.log"; then
              echo "::error::the stable installer failed (rc=$rc) with an error line — not its known verify_install bug"; exit 1
            fi
            if [[ "$(grep -v '^\s*$' "$RUNNER_TEMP/stable-install.log" | tail -1 | sed 's/\x1b\[[0-9;]*[A-Za-z]//g; s/\r//g')" != *"Config file present"* ]]; then
              echo "::error::the stable installer failed (rc=$rc) somewhere other than its known verify_install bug"; exit 1
            fi
            echo "::notice::v${JEN_STABLE_VERSION}'s own verify_install() died after 'Config file present' (a bug fixed since); the real outcome is asserted next"
          fi

      - name: Assert the stable baseline is the pinned version, healthy, with its data
        run: |
          source .github/scripts/ci-lib.sh
          systemctl is-active --quiet jen
          expect_eq "$(jen_version)" "$JEN_STABLE_VERSION" "the running version before the upgrade"
          sudo grep -q '10.99.0.0/24' /etc/jen/jen.config
          # the updater on disk is the stable release's own, byte for byte
          tar xzf "$RUNNER_TEMP/stable/jen-v${JEN_STABLE_VERSION}.tar.gz" -C "$RUNNER_TEMP" jen/jen-update-root.py
          expect_eq "$(sha_of /usr/local/sbin/jen-update-root.py)" "$(sha_of "$RUNNER_TEMP/jen/jen-update-root.py")" "the installed updater"
          echo "stable baseline: v$(jen_version), subnet config present, its own updater installed"

      # v5.66.0's own admin-password seeding discards a typed password (the bug
      # Q113 fixed: it never called create_app()), so on a clean box the admin's
      # password is Jen's generated token behind a forced change. Set it the way
      # the app itself would — with the STABLE release's own hasher — so the
      # assertions after the upgrade can log in, which also proves the account
      # survived it.
      - name: Give the stable box's admin a known password
        run: |
          sudo runuser -u www-data -- env JEN_ROOT=/opt/jen/current/app JEN_CONFIG_DIR=/etc/jen JEN_CONTENT_DIR=/var/lib/jen \
            ADMIN_PASSWORD="$ADMIN_PASSWORD" /opt/jen/current/venv/bin/python - << 'EOF'
          import os, sys
          sys.path.insert(0, "/opt/jen/current/app")
          from jen import create_app
          create_app()
          from jen.models.db import jen_db
          from jen.models.user import hash_password
          with jen_db() as db, db.cursor() as cur:
              cur.execute(
                  "UPDATE users SET password=%s, must_change_password=0 WHERE username='admin'",
                  (hash_password(os.environ["ADMIN_PASSWORD"]),),
              )
              assert cur.rowcount == 1, "no admin row to update"
          print("admin password set")
          EOF

      # v5.67.0-beta.5 (Q117) — v5.66.0's own install_files() left app_dir
      # group/other-writable on THIS runner (an additive `chmod -R a+rX` never
      # clears a write bit mkdir/cp set under whatever umask was in effect —
      # fixed since with `go-w`, but the stable release just installed above
      # predates that fix). HEAD's own _layout_appdir_itself_ok correctly
      # refuses to trust that before upgrading it: the hard stop
      # docs/troubleshooting.md describes, with its one-line fix. This step is
      # that fix, standing in for the operator the Health row would have told.
      - name: Fix the stable baseline's own permissive app_dir
        run: sudo chmod go-w /opt/jen

      # ── via installer ────────────────────────────────────────────────────
      - name: Upgrade with HEAD's install.sh
        if: matrix.via == 'installer'
        run: |
          mkdir -p "$RUNNER_TEMP/install-head"
          tar xzf dist/jen-head.tar.gz -C "$RUNNER_TEMP/install-head"
          cd "$RUNNER_TEMP/install-head/jen"
          sudo TERM=linux ./install.sh --unattended

      - name: Assert the installer upgrade is HEAD, healthy, and the data survived
        if: matrix.via == 'installer'
        run: |
          source .github/scripts/ci-lib.sh
          systemctl is-active --quiet jen
          expect_eq "$(jen_version)" "$HEAD_VERSION" "the running version after install.sh"
          sudo grep -q -- '--answers' /opt/jen/current/app/install.sh
          sudo grep -q '10.99.0.0/24' /etc/jen/jen.config
          cookie="$RUNNER_TEMP/cookies-upgrade.txt"
          jen_login "$cookie" "$ADMIN_PASSWORD"
          system_page=$(curl -sb "$cookie" -c "$cookie" "$JEN_URL/settings/system")
          require 'Update Now' "$system_page" "Settings -> System lost its Update control after the upgrade"
          refuse "container image.s job" "$system_page" "Settings -> System shows Docker wording after the upgrade"
          echo "upgraded v${JEN_STABLE_VERSION} -> v${HEAD_VERSION}: running version, config and the admin account all survived"

      # ── via updater ──────────────────────────────────────────────────────
      # The stable release's OWN updater, run for real. The box needs the beta
      # channel to be offered HEAD (a prerelease); everything else is the real
      # main(): see tools/ci_updater_hop.py for the four named stand-ins.
      - name: Hop 1 — the stable release's own updater onto HEAD's tree
        if: matrix.via == 'updater'
        run: |
          printf '\n[updates]\nchannel = beta\n' | sudo tee -a /etc/jen/jen.config > /dev/null
          sudo python3 tools/ci_updater_hop.py hop \
            --updater /usr/local/sbin/jen-update-root.py \
            --tarball dist/jen-head.tar.gz --version "$HEAD_VERSION" --prerelease

      - name: Assert hop 1 landed on HEAD with the box intact
        if: matrix.via == 'updater'
        run: |
          source .github/scripts/ci-lib.sh
          systemctl is-active --quiet jen
          expect_eq "$(jen_version)" "$HEAD_VERSION" "the running version after hop 1"
          expect_eq "$(readlink /opt/jen/current)" "releases/$HEAD_VERSION" "where current points"
          # the stable updater's install_self_update_files() put HEAD's updater in place
          expect_eq "$(sha_of /usr/local/sbin/jen-update-root.py)" "$(sha_of jen-update-root.py)" "the updater after hop 1"
          sudo grep -q '10.99.0.0/24' /etc/jen/jen.config
          cookie="$RUNNER_TEMP/cookies-hop1.txt"
          jen_login "$cookie" "$ADMIN_PASSWORD"
          system_page=$(curl -sb "$cookie" -c "$cookie" "$JEN_URL/settings/system")
          # the stable updater copies a jen.service only if the new tree ships
          # one (HEAD ships a template), so the unit is still the stable box's
          # own — the deployment fallback (INVOCATION_ID) is what keeps the
          # controls right until the second hop renders the new one
          require 'Update Now' "$system_page" "Settings -> System has no Update control after hop 1"
          refuse "container image.s job" "$system_page" "Settings -> System shows Docker wording after hop 1"
          echo "hop 1: v${JEN_STABLE_VERSION} -> v${HEAD_VERSION} by the stable release's own updater"

      - name: Hop 2 — HEAD's updater onto a newer release
        if: matrix.via == 'updater'
        run: |
          # the new updater refuses an app_dir that is group/other-writable; hop 1 changed no ownership, this stays fixed
          next="${HEAD_VERSION%%-*}"
          IFS=. read -r major minor patch <<< "$next"
          next="${major}.${minor}.$((patch + 1))"
          echo "NEXT_VERSION=$next" >> "$GITHUB_ENV"
          python3 tools/ci_updater_hop.py bump --src dist/jen-head.tar.gz --out dist/jen-next.tar.gz --version "$next"
          sudo python3 tools/ci_updater_hop.py hop \
            --updater /usr/local/sbin/jen-update-root.py \
            --tarball dist/jen-next.tar.gz --version "$next"

      - name: Assert hop 2 — the rendered unit and the Update control
        if: matrix.via == 'updater'
        run: |
          source .github/scripts/ci-lib.sh
          systemctl is-active --quiet jen
          expect_eq "$(jen_version)" "$NEXT_VERSION" "the running version after hop 2"
          expect_eq "$(readlink /opt/jen/current)" "releases/$NEXT_VERSION" "where current points"
          unit=$(systemctl cat jen)
          require 'JEN_SERVICE_MANAGER=systemd' "$unit" "the unit HEAD's updater rendered lacks JEN_SERVICE_MANAGER=systemd"
          require 'JEN_ROOT=/opt/jen/current/app' "$unit" "the rendered unit does not point JEN_ROOT at the live release"
          refuse '@@' "$unit" "the rendered unit still carries an unsubstituted placeholder"
          cookie="$RUNNER_TEMP/cookies-hop2.txt"
          jen_login "$cookie" "$ADMIN_PASSWORD"
          system_page=$(curl -sb "$cookie" -c "$cookie" "$JEN_URL/settings/system")
          require 'Update Now' "$system_page" "Settings -> System has no Update control after hop 2"
          require 'data-confirm="Restart Jen now?"' "$system_page" "Settings -> System has no Restart control after hop 2"
          refuse "container image.s job" "$system_page" "Settings -> System shows Docker wording after hop 2"
          echo "hop 2: HEAD's own updater went v${HEAD_VERSION} -> v${NEXT_VERSION}; the rendered unit and both controls are right"

      - name: Kea log on failure
        if: failure()
        run: docker logs kea 2>&1 | tail -100 || true

      - name: Jen service log on failure
        if: failure()
        run: sudo journalctl -u jen -n 200 --no-pager || true

  # v5.67.0-beta.10 (Q122) — docs/manual-install.md, RUN. The page's marked blocks
  # (tools/doc_commands.py) become one script that builds a whole install by hand on a
  # clean runner: packages, the versioned layout, a venv, the config, the unit rendered
  # by `jen-update-root.py --render-unit`, sudoers, start. Where the page says to edit a
  # file or paste SQL, a named stand-in (.github/scripts/manual-install-hooks.sh) does it.
  # What the job then asserts is what an operator following the page would rely on: Jen
  # answers at THIS tree's version, the unit has no unresolved placeholder and carries the
  # deployment signal, and the first-boot admin password file exists.
  manual-install:
    name: manual-install.md, run (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      database:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -pci_root_pw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Harden /opt for this runner
        # Same reason as the install job: the runner image ships /opt mode 777 and the layout
        # check refuses a group/other-writable ancestor. A real host is already like this.
        run: sudo chmod 755 /opt

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Extract the page's commands
        run: |
          { cat .github/scripts/manual-install-hooks.sh; python tools/doc_commands.py docs/manual-install.md; } > "$RUNNER_TEMP/manual-install.sh"
          bash -n "$RUNNER_TEMP/manual-install.sh"
          grep -c '^# --- ' "$RUNNER_TEMP/manual-install.sh"

      - name: Follow the page
        run: bash -eo pipefail "$RUNNER_TEMP/manual-install.sh"

      - name: Jen is running this tree's version, with a unit the page rendered
        run: |
          source .github/scripts/ci-lib.sh
          head_version=$(grep -oP 'JEN_VERSION\s*=\s*"\K[^"]+' jen/__init__.py)
          up=
          for _ in $(seq 60); do
              if jen_version > /dev/null 2>&1; then up=1; break; fi
              sleep 2
          done
          if [[ -z "$up" ]]; then
              echo "::error::Jen never answered /api/v1/health after following the page"
              exit 1
          fi
          expect_eq "$(jen_version)" "$head_version" "the version a hand-installed Jen reports"
          unit=$(cat /etc/systemd/system/jen.service)
          refuse '@@' "$unit" "the rendered unit still has a placeholder"
          require 'JEN_SERVICE_MANAGER=systemd' "$unit" "the rendered unit lacks the deployment signal"
          require "ExecStart=/opt/jen/current/venv/bin/python /opt/jen/current/app/run.py" "$unit" "the unit does not run the current release's venv"
          [[ "$(readlink /opt/jen/current)" == "releases/$head_version" ]] || {
              echo "::error::/opt/jen/current -> $(readlink /opt/jen/current), expected releases/$head_version (a beta's directory keeps its full version)"
              exit 1
          }
          sudo test -f /var/lib/jen/initial-admin-password || {
              echo "::error::first boot did not write /var/lib/jen/initial-admin-password"
              exit 1
          }
          echo "a hand-installed Jen answers as v${head_version}"

      - name: Jen service log on failure
        if: failure()
        run: sudo journalctl -u jen -n 200 --no-pager || true

  bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install bandit
        run: pip install -q bandit

      - name: Run bandit
        # -ll: only report medium/high confidence findings — low-confidence
        # noise isn't worth gating a release over. -r: recursive.
        # -b: diff against .github/bandit-baseline.json, a snapshot of the
        # 53 findings that existed as of the v5.0 Phase 1 IPv6 work, each
        # manually traced and verified safe (whitelisted table names,
        # int()-cast values, trust-on-first-use SSH host-key persistence —
        # see docs/THREAT_MODEL.md). This means CI only fails on genuinely
        # NEW findings introduced going forward, not on the already-reviewed
        # backlog — verified directly: re-running bandit against an injected
        # fake shell=True call still fails even with the baseline present.
        run: bandit -r jen/ plugins/ -ll -b .github/bandit-baseline.json

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies + pip-audit
        # Runtime pins come from requirements.txt (see note in the pytest
        # job). pip-audit then checks whatever actually got installed.
        run: |
          pip install -q --upgrade pip
          pip install -q -r requirements.txt pip-audit

      - name: Run pip-audit
        # Floor-pinned deps (jen/config.py) mean the *installed* version can
        # be newer than the pin — pip-audit checks what's actually installed,
        # which is exactly what a real deployment would end up running.
        # Verified clean in an isolated environment matching this exact
        # install command: 0 findings against every one of Jen's actual
        # runtime dependencies, once pip itself is upgraded first (an
        # outdated bundled pip is a false-positive source here — it's build
        # tooling, not something Jen's code ever imports at runtime).
        run: pip-audit
