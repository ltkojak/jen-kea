name: Tests

# Reusable workflow — called by ci.yml (every push/PR) and release.yml
# (gates every tagged release). Not meant to be triggered directly.
on:
  workflow_call:
    inputs:
      # v5.66.0-beta.2 (Q104): release.yml signs one exact commit (the tag) and
      # must test that SAME commit, not whatever main has drifted to by the time
      # this job runs. Empty default means every existing caller (ci.yml, and
      # release.yml before this Q) keeps testing github.ref unchanged.
      ref:
        required: false
        type: string
        default: ''
    secrets:
      # Q97 k: the docs-screenshot leak guard's personal markers. Passed by name from each
      # caller (never `secrets: inherit`: release.yml holds the signing key).
      JEN_DOCS_FORBIDDEN:
        required: false

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }} · ${{ matrix.db-image }})
    runs-on: ubuntu-latest

    # README claims Python 3.10+ / Ubuntu 22.04 (which ships 3.10). With
    # floor-pinned deps a future "latest compatible" package could quietly
    # drop 3.10 while CI stayed green on 3.12 — so test the real floor too.
    # Jen also claims MySQL *or* MariaDB support; the third leg exercises
    # MySQL 8 (only MariaDB was tested through v5.7.x). The MariaDB image
    # honors the MYSQL_* env vars too, so one block covers both.
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            db-image: mariadb:10.11
            db-ping: mariadb-admin ping -h 127.0.0.1 -u root -pci_root_pw
          - python-version: '3.12'
            db-image: mariadb:10.11
            db-ping: mariadb-admin ping -h 127.0.0.1 -u root -pci_root_pw
          - python-version: '3.12'
            db-image: mysql:8.0
            db-ping: mysqladmin ping -h 127.0.0.1 -u root -pci_root_pw

    # v5.5.x — JEN_ROOT (v5.3.3) points the app's static/template/plugin
    # paths at the checkout, replacing the old `ln -sf` into /opt/jen.
    # If the override didn't work, these tests wouldn't run at all.
    env:
      JEN_ROOT: ${{ github.workspace }}

    services:
      database:
        image: ${{ matrix.db-image }}
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: jen_test
          MYSQL_USER: jen
          MYSQL_PASSWORD: ci_jen_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.db-ping }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Runtime pins come from requirements.txt (the single source of
        # truth, shared with install.sh and Dockerfile). Never re-list
        # packages here — tests/test_dependency_consistency.py enforces it.
        run: pip install -q -r requirements.txt pytest

      - name: Provision /etc/jen
        # init_jen_db() unconditionally does os.makedirs("/etc/jen/ssl")
        # and os.makedirs("/etc/jen/ssh") on startup — fine on a real
        # deployment (Jen runs as www-data, which owns /etc/jen), but on
        # a fresh GitHub-hosted runner /etc/jen doesn't exist and the
        # default non-root "runner" user can't create it under /etc
        # without sudo. Create it once here and hand over ownership so
        # nothing later in the run needs sudo for it again.
        run: |
          sudo mkdir -p /etc/jen/ssl /etc/jen/ssh
          sudo chown -R "$(whoami)" /etc/jen

      - name: Run test suite
        env:
          JEN_DB_HOST: 127.0.0.1
          JEN_DB_USER: jen
          JEN_DB_PASS: ci_jen_pw
        run: |
          python3 -m pytest tests/ -v

  # v5.39.0 (Q40) — a small Playwright suite driving a real Chromium
  # against a real create_app() (werkzeug, ephemeral port, background
  # thread) and a real MariaDB, plus a fake Kea Control Agent
  # (tests/e2e/_fake_kea_server.py). Matrix-free (one Python, one DB) —
  # this suite exercises browser JS and page wiring, not database
  # portability, which the matrix above already covers. Runs after
  # `pytest` so a broken unit suite fails fast without waiting on
  # Chromium; gates releases the same way every job in this workflow
  # does (release.yml calls this whole workflow via workflow_call).
  e2e:
    name: e2e (Playwright)
    needs: pytest
    runs-on: ubuntu-latest

    env:
      JEN_ROOT: ${{ github.workspace }}

    services:
      database:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: jen_test
          MYSQL_USER: jen
          MYSQL_PASSWORD: ci_jen_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -pci_root_pw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        # Same single-source-of-truth rule as the pytest job above, plus
        # the two e2e-only packages (requirements-dev.txt, not a runtime
        # pin — test_dependency_consistency.py only governs requirements.txt).
        run: pip install -q -r requirements.txt pytest playwright pytest-playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Provision /etc/jen
        run: |
          sudo mkdir -p /etc/jen/ssl /etc/jen/ssh
          sudo chown -R "$(whoami)" /etc/jen

      - name: Run e2e suite
        env:
          JEN_DB_HOST: 127.0.0.1
          JEN_DB_USER: jen
          JEN_DB_PASS: ci_jen_pw
        run: python -m pytest tests/e2e -m e2e -v --tracing=retain-on-failure

      # Q62: a second pytest step, its own database (the live_server fixture's
      # _reset_test_db() drops the journeys' tables first, as it always does),
      # generating the README's screenshots from tests/e2e/demo_data.py's
      # fictional dataset instead of a real install. tests/e2e/test_docs_screenshots.py
      # skips itself unless JEN_E2E_DATASET=demo, so this is the only place that ever runs.
      - name: Run docs screenshot suite
        env:
          JEN_DB_HOST: 127.0.0.1
          JEN_DB_USER: jen
          JEN_DB_PASS: ci_jen_pw
          JEN_E2E_DATASET: demo
          # Q97 k: the leak guard's personal markers. A dependabot run and a pull request from a fork are
          # given no secrets by GitHub, so the "was it present" assertion is not required there (Q99 j).
          JEN_DOCS_FORBIDDEN: ${{ secrets.JEN_DOCS_FORBIDDEN }}
          JEN_DOCS_FORBIDDEN_REQUIRED: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.fork != true && '1' || '' }}
        run: python -m pytest tests/e2e/test_docs_screenshots.py -m e2e -v

      - name: Upload docs screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-screenshots
          path: artifacts/docs/
          retention-days: 30
          if-no-files-found: warn

      # v5.51.0 (Q58): the phone (390 x 844) and desktop (1440 x 900) screenshots
      # tests/e2e/test_mobile.py writes. Uploaded on EVERY run — pass or fail — so
      # the pages can be reviewed on a phone without reproducing anything locally.
      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-screenshots
          path: artifacts/mobile/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload desktop screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-screenshots
          path: artifacts/desktop/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Pinned — `ruff format`'s output shifts subtly between releases, so an
      # unpinned bump could fail `format --check` on a no-op. Dependabot PRs
      # the bump; reformat in that same PR if it drifts.
      - name: Install ruff
        run: pip install -q ruff==0.16.6

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # v5.9.1 — install.sh is a load-bearing part of the deployment story
      # and had no static-analysis gate. Severity `error` to start: the
      # script predated this check and carried style warnings.
      # v5.67.0 (Q113, item d) — raised to `warning` now that both scripts
      # are actually clean at that level (four real findings fixed: two
      # unused color variables, require_root() referencing $* when nothing
      # ever passes it args, and one `local x=$(cmd)` that could mask a
      # failing command's exit status).
      - name: shellcheck (warnings)
        run: shellcheck -S warning install.sh uninstall.sh

  # v5.67.0-beta.5 (Q117) — _layout_ancestors_ok refuses outright (never
  # just warns) when an EXISTING ancestor of a layout directory is
  # writable by group or other: a local user could otherwise rename the
  # root-owned child aside after install finishes and plant a symlink in
  # its place for the next privileged run to follow. Needs no Kea/DB/
  # tarball — the check runs at the very top of install.sh, before
  # main() — so this is deliberately its own small job, not folded into
  # the heavy `install` job below.
  install-layout-negative:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: A group/other-writable ancestor is refused
        run: |
          sudo mkdir -p /opt/permissive-parent
          sudo chmod 777 /opt/permissive-parent
          set +e
          out=$(sudo TERM=linux ./install.sh --app-dir /opt/permissive-parent/jen 2>&1)
          rc=$?
          set -e
          echo "$out"
          [[ $rc -ne 0 ]]
          echo "$out" | grep -q "writable by group or other"
          echo "refused as expected — rc=$rc"

  # v5.67.0 (Q113) — install.sh had never actually been run by anything
  # before this: CI provisioned /opt/jen and /etc/jen by hand and the
  # system-test suite runs Jen in Docker. This runs the REAL script
  # against REAL systemd, REAL sudo, a REAL MariaDB and a REAL kea-dhcp4,
  # on both Ubuntu releases the README claims support for: a fresh
  # install from an --answers file, the upgrade every operator is about
  # to make (latest stable, signature-verified, then this commit's
  # tarball over it), and uninstall. Gates release.yml the same way
  # every job in this reusable workflow does.
  install:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    env:
      JEN_ROOT: ${{ github.workspace }}
      # v5.67.0-beta.1 (Q113): kept in sync with kea-compat.yml's own
      # non-dev matrix legs by hand — this job needs exactly one real,
      # stable Kea, not the whole compatibility matrix.
      KEA_IMAGE: docker.cloudsmith.io/isc/docker/kea-dhcp4:3.2.0

    # Kea's own database. Jen's database is provisioned on this same
    # server in a step below — the common real-world topology (both on
    # one host) needs only one MariaDB image running, not two.
    services:
      database:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: kea
          MYSQL_USER: kea
          MYSQL_PASSWORD: kea_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -pci_root_pw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # v5.67.0-beta.5 (Q117) — this hosted runner image ships /opt mode
      # 777 (its own tool-cache installers write there without sudo);
      # _layout_ancestors_ok now refuses that outright rather than
      # warning (see install-layout-negative above for the check itself),
      # so every /opt/jen leg below needs a sane /opt first. A real host
      # is already like this — install-layout-negative is what still
      # proves the check itself works.
      - name: Harden /opt for this runner
        run: sudo chmod 755 /opt

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies (for the Kea config generator)
        run: pip install -q -r requirements.txt

      - name: Create Jen's database
        # Same server as Kea's, a separate database and user — the
        # topology install.sh's own wizard describes for "Jen DB host"
        # defaulting to the Kea DB host.
        run: |
          mysql -h 127.0.0.1 -u root -pci_root_pw -e "
            CREATE DATABASE jen;
            CREATE USER 'jen'@'%' IDENTIFIED BY 'jen_pw';
            GRANT ALL PRIVILEGES ON jen.* TO 'jen'@'%';
            FLUSH PRIVILEGES;"

      - name: Install the Kea MySQL schema
        # Same recipe as kea-compat.yml: no kea-admin image is published,
        # so borrow the daemon image (it already has ISC's apk repo
        # configured) at the SAME version the schema must match.
        run: |
          docker pull "$KEA_IMAGE"
          docker run --rm --network host --entrypoint ash "$KEA_IMAGE" -c '
            set -e
            apk add --no-cache curl bash >/dev/null
            curl -1sLf "https://dl.cloudsmith.io/public/isc/kea-3-2/setup.alpine.sh" | bash >/dev/null
            apk update >/dev/null
            apk add --no-cache mariadb-client "isc-kea-admin~=3.2.0" >/dev/null
            echo "[client]" > /etc/my.cnf.d/nossl.cnf
            echo "skip-ssl" >> /etc/my.cnf.d/nossl.cnf
            kea-admin db-init mysql -h 127.0.0.1 -u kea -p kea_pw -n kea
          '

      - name: Start kea-dhcp4
        run: |
          mkdir -p kea-conf
          python -m tests.kea_compat.kea_config > kea-conf/kea-dhcp4.conf
          printf '%s' jen > kea-conf/jen-api.user
          printf '%s' jen_api_pw > kea-conf/jen-api.pw
          chmod 644 kea-conf/jen-api.user kea-conf/jen-api.pw
          docker run -d --name kea --network host --tmpfs /var/run/kea \
            -e MARIADB_TLS_DISABLE_PEER_VERIFICATION=1 \
            -v "$PWD/kea-conf:/etc/kea:ro" "$KEA_IMAGE"
          for i in $(seq 1 30); do
            if curl -sf -m 2 -H 'Content-Type: application/json' \
                 -u jen:jen_api_pw -d '{"command":"version-get"}' http://127.0.0.1:8004/ >/dev/null; then
              echo "kea-dhcp4 answered after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::kea-dhcp4 never answered on :8004"
          docker logs kea
          exit 1

      - name: Build this commit's tarball
        run: |
          mkdir -p dist
          git archive --format=tar --prefix=jen/ HEAD | gzip -9 > dist/jen-head.tar.gz
          ls -lh dist/

      - name: Write the answers file
        # v5.67.0 (Q113) — JEN_INITIAL_ADMIN_PASSWORD set means init_jen_db()
        # seeds the admin account with THIS password and must_change_password=0
        # (see jen/models/db.py) — the login assertion below logs in with it.
        run: |
          umask 077
          cat > "$RUNNER_TEMP/answers.env" << 'EOF'
          JEN_KEA_API_URL=http://127.0.0.1:8004
          JEN_KEA_API_USER=jen
          JEN_KEA_API_PASS=jen_api_pw
          JEN_KEA_DB_HOST=127.0.0.1
          JEN_KEA_DB_USER=kea
          JEN_KEA_DB_PASS=kea_pw
          JEN_KEA_DB_NAME=kea
          JEN_DB_HOST=127.0.0.1
          JEN_DB_USER=jen
          JEN_DB_PASS=jen_pw
          JEN_DB_NAME=jen
          JEN_INITIAL_ADMIN_PASSWORD=ci-test-passw0rd-!
          JEN_SUBNETS=1=Test,10.99.0.0/24
          JEN_HTTP_PORT=5050
          JEN_HTTPS_PORT=8443
          EOF

      - name: Fresh install from the answers file
        run: |
          mkdir -p "$RUNNER_TEMP/install-head"
          tar xzf dist/jen-head.tar.gz -C "$RUNNER_TEMP/install-head"
          cd "$RUNNER_TEMP/install-head/jen"
          sudo TERM=linux ./install.sh --answers "$RUNNER_TEMP/answers.env" --unattended

      - name: Assert the fresh install is real
        run: |
          set -e
          systemctl is-active --quiet jen
          systemctl is-enabled --quiet jen
          echo "service active and enabled"

          curl -sf http://127.0.0.1:5050/api/v1/health | grep -q jen_version
          echo "health endpoint answers"

          [[ "$(sudo stat -c '%U:%G' /opt/jen/current/app/run.py)" == "root:root" ]]
          sudo -u www-data test ! -w /opt/jen/current/app/run.py
          echo "app tree root-owned, not writable by the service user"

          [[ "$(sudo stat -c '%a' /etc/jen/jen.config)" == "600" ]]
          [[ "$(sudo stat -c '%U:%G' /etc/jen/jen.config)" == "www-data:www-data" ]]
          echo "jen.config is 0600, service-owned"

          sudo visudo -c -f /etc/sudoers.d/jen
          echo "sudoers entry is valid"

          systemctl cat jen-update.service >/dev/null
          systemctl cat jen-plugin-install.service >/dev/null
          echo "the three units are installed"

          cookie="$RUNNER_TEMP/cookies.txt"
          csrf=$(curl -sc "$cookie" http://127.0.0.1:5050/login | grep -oP 'name="csrf_token" value="\K[^"]+' | head -1)
          [[ -n "$csrf" ]]
          code=$(curl -sb "$cookie" -c "$cookie" -X POST http://127.0.0.1:5050/login \
            -d "username=admin&password=ci-test-passw0rd-!&csrf_token=$csrf" \
            -o /dev/null -w '%{http_code}')
          [[ "$code" =~ ^3 ]]
          echo "logged in as admin with the answers file's own password"

      - name: Uninstall (interim reset before the stable jump)
        working-directory: ${{ runner.temp }}/install-head/jen
        run: printf 'y\n1\n' | sudo ./uninstall.sh

      - name: Fetch the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/stable"
          gh release download --repo "${{ github.repository }}" \
            --pattern 'jen-v*.tar.gz' --pattern 'SHA256SUMS*' --dir "$RUNNER_TEMP/stable"
          ls -lh "$RUNNER_TEMP/stable"

      - name: Verify the stable release's signature
        # Same verification release.yml runs on itself before publishing
        # (ssh-keygen -Y verify against RELEASE_SIGNERS as extracted from
        # the downloaded tarball's OWN jen-update-root.py) — a public-key
        # check, no secret needed to verify, only to sign.
        run: |
          cd "$RUNNER_TEMP/stable"
          tarball="$(ls jen-v*.tar.gz)"
          signers_line="$(tar xzf "$tarball" jen/jen-update-root.py -O \
            | sed -n 's/^RELEASE_SIGNERS = "\(.*\)"$/\1/p')"
          [[ -n "$signers_line" ]] || { echo "::error::no RELEASE_SIGNERS in the downloaded tarball"; exit 1; }
          printf '%s\n' "$signers_line" > allowed_signers
          ssh-keygen -Y verify -f allowed_signers -I release@jen -n jen-release \
            -s SHA256SUMS.sig < SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          echo "Latest stable release verified."

      - name: Fresh install (latest stable) — the upgrade's starting point
        # v5.66.0 is immutable, already-tagged code that predates
        # --answers entirely, and --unattended there only resolves
        # prompt_input/_yn/_choice to their DEFAULTS — useless placeholder
        # hosts like "YOUR-KEA-SERVER", not this job's real service
        # containers, which would fail to connect and never even reach a
        # running service. So this leg drives the full original wizard
        # through a real pty instead, answering every prompt in the exact
        # order v5.66.0's collect_config() asks them (confirmed against
        # `git show v5.66.0:install.sh`): install type, Kea API
        # URL/user/pass, Kea DB host/user/pass/name, Jen DB
        # host/user/pass/name, admin password (+ confirm), one subnet
        # (id/name/CIDR) then Enter to finish, SSH y/n, DDNS y/n, HTTP/
        # HTTPS ports. `script -qec ... -e` forwards piped stdin to the
        # child's tty and makes its own exit status the wrapped command's;
        # TERM=linux sidesteps the clear/terminfo bug this same v5.66.0
        # code has (fixed on this branch, not on the already-tagged one).
        #
        # v5.66.0's verify_install() also carries the identical stale-
        # Jinja-filter-list + `$?`-after-assignment set -e bugs this Q
        # fixed on this branch (jen/__init__.py has registered relfmt and
        # hostname since before this tag) — confirmed against this exact
        # run's own log: config written, admin password updated, service
        # started and reported running, THEN the same silent death
        # verify_install() always has here. That is an already-tagged
        # release's own cosmetic reporting bug, not a real install
        # failure — the actual install is done by that point. Tolerated
        # here with `|| true`; the next step is what actually decides
        # whether this leg succeeded.
        run: |
          mkdir -p "$RUNNER_TEMP/install-stable"
          tar xzf "$RUNNER_TEMP/stable"/jen-v*.tar.gz -C "$RUNNER_TEMP/install-stable"
          cd "$RUNNER_TEMP/install-stable/jen"
          cat > "$RUNNER_TEMP/stable-wizard-input.txt" << 'WIZARD'
          1
          http://127.0.0.1:8004
          jen
          jen_api_pw
          127.0.0.1
          kea
          kea_pw
          kea
          127.0.0.1
          jen
          jen_pw
          jen
          ci-test-passw0rd-!
          ci-test-passw0rd-!
          1
          Test
          10.99.0.0/24

          n
          n
          5050
          8443
          WIZARD
          script -qec "sudo TERM=linux ./install.sh" /dev/null < "$RUNNER_TEMP/stable-wizard-input.txt" \
            || echo "::notice::v5.66.0's own verify_install() died on a bug already fixed on this branch — checking the real outcome in the next step"

      - name: Assert the stable baseline is healthy
        run: |
          systemctl is-active --quiet jen
          curl -sf http://127.0.0.1:5050/api/v1/health | grep -q jen_version
          sudo grep -q '10.99.0.0/24' /etc/jen/jen.config
          echo "stable baseline healthy, subnet config present"

      # v5.67.0-beta.5 (Q117) — v5.66.0's own install_files() left app_dir
      # group/other-writable on THIS runner (an additive `chmod -R a+rX`
      # never clears a write bit `mkdir -p`/`cp -r` set under whatever
      # umask was in effect — fixed on this branch with `go-w`, but the
      # stable release just installed above predates that fix). HEAD's
      # own _layout_appdir_itself_ok now correctly refuses to trust that
      # before upgrading it — exactly the hard stop docs/troubleshooting.md
      # describes, with its own one-line fix. This step is that fix,
      # standing in for the operator the real Health-row warning would
      # have told to run it before upgrading.
      - name: Fix the stable baseline's own permissive app_dir before upgrading it
        run: sudo chmod go-w /opt/jen

      - name: Upgrade to this commit
        working-directory: ${{ runner.temp }}/install-head/jen
        run: sudo TERM=linux ./install.sh --unattended

      - name: Assert the upgrade is healthy and data survived
        # v5.66.0's own admin-password seeding is the bug fixed earlier in
        # this Q (it never called create_app(), so a typed password was
        # silently discarded and Jen fell back to its own generated
        # initial-admin-password token) — logging in with a password THIS
        # job chose would test that pre-existing bug, not the upgrade.
        # "Data survived" instead checks the one thing collect_config()
        # genuinely skips on an upgrade (CONFIGURE=false keeps the
        # existing file verbatim): the subnet line from the stable leg's
        # config is still there, untouched, after HEAD's install.sh ran.
        # JEN_VERSION is still identical on both legs until the release
        # commit at the end of this Q bumps it, so "the running code
        # actually changed" is checked by content (this Q's --answers
        # flag existing in the installed tree), not by a version string
        # or a second release directory appearing.
        run: |
          set -e
          systemctl is-active --quiet jen
          curl -sf http://127.0.0.1:5050/api/v1/health | grep -q jen_version
          echo "healthy after upgrade"

          sudo grep -q -- '--answers' /opt/jen/current/app/install.sh
          echo "the upgrade actually replaced the running code"

          sudo grep -q '10.99.0.0/24' /etc/jen/jen.config
          echo "the config from before the upgrade is still there"

      - name: Uninstall
        working-directory: ${{ runner.temp }}/install-head/jen
        run: printf 'y\n1\n' | sudo ./uninstall.sh

      - name: Assert uninstall left what docs/installation.md promises
        run: |
          set -e
          [[ ! -d /opt/jen ]]
          [[ ! -f /etc/systemd/system/jen.service ]]
          [[ ! -f /etc/sudoers.d/jen ]]
          sudo test -f /etc/jen/jen.config
          sudo test -d /etc/jen/ssl
          sudo test -d /etc/jen/ssh
          sudo test -d /var/lib/jen
          echo "app + service + sudoers removed; config, SSL, SSH and content preserved"

      # v5.67.0 (Q114) — the same fresh-install/upgrade/uninstall cycle
      # again, this time with --app-dir/--config-dir/--data-dir, reusing
      # this job's already-running Kea/MariaDB rather than a second job
      # (which would just re-pay their startup cost). Ports are reused
      # from the legs above — each one's own uninstall already stopped
      # the service before this starts.
      #
      # The level-1 uninstalls above intentionally preserve
      # /etc/jen-layout.conf (same as jen.config/content — "detected
      # automatically" on a reinstall), so one is still sitting there
      # recording app_dir=/opt/jen from the very first leg's fresh
      # install. This leg means a genuinely fresh, clean box — the
      # caught-by-this-same-leg's-first-real-run bug was install.sh
      # correctly refusing to relocate an "existing" install over it.
      - name: Clear the leftover layout record from the legs above
        run: sudo rm -f /etc/jen-layout.conf

      - name: Fresh install with a relocated layout
        run: |
          mkdir -p "$RUNNER_TEMP/install-relocated"
          tar xzf dist/jen-head.tar.gz -C "$RUNNER_TEMP/install-relocated"
          cd "$RUNNER_TEMP/install-relocated/jen"
          sudo TERM=linux ./install.sh --answers "$RUNNER_TEMP/answers.env" --unattended \
            --app-dir /srv/jen/app --config-dir /srv/jen/etc --data-dir /srv/jen/data \
            2>&1 | tee "$RUNNER_TEMP/relocated-install.log"

      - name: Assert the relocated install is real
        run: |
          set -e
          systemctl is-active --quiet jen
          curl -sf http://127.0.0.1:5050/api/v1/health | grep -q jen_version
          echo "relocated service healthy"

          [[ "$(sudo stat -c '%U:%G' /srv/jen/app/current/app/run.py)" == "root:root" ]]
          sudo -u www-data test ! -w /srv/jen/app/current/app/run.py
          echo "relocated app tree root-owned, not writable by the service user"

          [[ "$(sudo stat -c '%a' /srv/jen/etc/jen.config)" == "600" ]]
          [[ "$(sudo stat -c '%U:%G' /srv/jen/etc/jen.config)" == "www-data:www-data" ]]
          echo "relocated jen.config is 0600, service-owned"

          [[ "$(sudo stat -c '%U:%a' /etc/jen-layout.conf)" == "root:644" ]]
          sudo grep -q '^app_dir = /srv/jen/app$' /etc/jen-layout.conf
          sudo grep -q '^config_dir = /srv/jen/etc$' /etc/jen-layout.conf
          sudo grep -q '^data_dir = /srv/jen/data$' /etc/jen-layout.conf
          echo "layout file recorded root:root 0644 with the chosen paths"

          env=$(systemctl show jen -p Environment --value)
          grep -q 'JEN_CONFIG_DIR=/srv/jen/etc' <<< "$env"
          grep -q 'JEN_CONTENT_DIR=/srv/jen/data' <<< "$env"
          grep -q 'JEN_ROOT=/srv/jen/app/current/app' <<< "$env"
          echo "rendered unit's Environment= matches the relocated layout"

          [[ ! -e /opt/jen ]]
          echo "nothing landed at the historical default app_dir"

      # v5.67.0-beta.5 (Q117, item d) — the behavioral half of the fix:
      # install.sh's [kea_ssh] key_path and its SSL-summary check, plus
      # three jen-update-root.py log lines, hardcoded /etc/jen or
      # /opt/jen regardless of where the install actually lives. Four
      # real sources, grepped for the three literal defaults — a
      # commented reference to the always-fixed /etc/jen-layout.conf
      # (in the rendered unit's own template comments) is the one
      # expected, excluded match.
      - name: Assert no hardcoded layout literal leaked into the relocated install
        run: |
          set -e
          fail=0
          # (?<![\w/]) — a real standalone reference, not a substring
          # inside a larger path: this leg's own --config-dir /srv/jen/etc
          # makes the GENERATED config's own path /srv/jen/etc/jen.config,
          # which otherwise self-matches "/etc/jen" in its middle.
          check() {
              local label="$1" file="$2"
              if [[ -f "$file" ]] && sudo cat "$file" | grep -Pv '^\s*#' \
                  | grep -Pq '(?<![\w/])/etc/jen(?!-layout\.conf)|(?<![\w/])/opt/jen|(?<![\w/])/var/lib/jen'; then
                  echo "::error::$label ($file) contains a hardcoded layout literal"
                  sudo cat "$file" | grep -Pv '^\s*#' \
                      | grep -P '(?<![\w/])/etc/jen(?!-layout\.conf)|(?<![\w/])/opt/jen|(?<![\w/])/var/lib/jen'
                  fail=1
              fi
          }
          check "generated jen.config"   /srv/jen/etc/jen.config
          check "rendered unit"          /etc/systemd/system/jen.service
          check "install run's own summary" "$RUNNER_TEMP/relocated-install.log"
          sudo journalctl -u jen-update --no-pager > "$RUNNER_TEMP/jen-update.journal" 2>/dev/null || true
          check "jen-update.service journal" "$RUNNER_TEMP/jen-update.journal"
          [[ $fail -eq 0 ]]
          echo "no hardcoded /etc/jen, /opt/jen or /var/lib/jen in any generated artifact"

      - name: Upgrade the relocated install in place
        working-directory: ${{ runner.temp }}/install-relocated/jen
        run: sudo TERM=linux ./install.sh --unattended

      - name: Assert the relocated upgrade is healthy
        run: |
          set -e
          systemctl is-active --quiet jen
          curl -sf http://127.0.0.1:5050/api/v1/health | grep -q jen_version
          sudo grep -q '10.99.0.0/24' /srv/jen/etc/jen.config
          echo "relocated upgrade healthy, config preserved"

      - name: Uninstall the relocated install
        working-directory: ${{ runner.temp }}/install-relocated/jen
        run: printf 'y\n1\n' | sudo ./uninstall.sh

      - name: Assert relocated uninstall left what it should
        run: |
          set -e
          [[ ! -d /srv/jen/app ]]
          [[ ! -f /etc/systemd/system/jen.service ]]
          sudo test -f /srv/jen/etc/jen.config
          sudo test -d /srv/jen/data
          sudo test -f /etc/jen-layout.conf
          echo "relocated app removed; config/data/layout-record preserved (level 1)"

      # v5.67.0 (Q115 step 3) — install.sh no longer asks for Kea's API,
      # database, subnets, SSH, or DDNS interactively (jen/setup now
      # does that, live, after first login); an answers file that leaves
      # all of those keys out must still produce a healthy install whose
      # first superadmin login lands on /setup instead of the dashboard.
      - name: Clear the leftover layout record from the legs above
        run: sudo rm -f /etc/jen-layout.conf

      - name: Write an answers file with no Kea keys at all
        # v5.67.0 (Q115 step 3 fixup 6) — no JEN_INITIAL_ADMIN_PASSWORD
        # here: the jen database this whole job shares was created once at
        # the very top and is never dropped between legs (only install.sh's
        # own app tree gets reinstalled), so the admin row the FIRST leg's
        # answers file seeded is still the only one in `users` — Jen's own
        # seeding (jen/models/db.py::init_jen_db) is "if no users exist",
        # by design, so a second JEN_INITIAL_ADMIN_PASSWORD here would be
        # silently ignored. Logging in below with that first leg's own
        # ci-test-passw0rd-! is correct, not a workaround.
        run: |
          umask 077
          cat > "$RUNNER_TEMP/answers-no-kea.env" << 'EOF'
          JEN_DB_HOST=127.0.0.1
          JEN_DB_USER=jen
          JEN_DB_PASS=jen_pw
          JEN_DB_NAME=jen
          JEN_HTTP_PORT=5050
          JEN_HTTPS_PORT=8443
          EOF

      - name: Fresh install from the no-Kea answers file
        run: |
          mkdir -p "$RUNNER_TEMP/install-no-kea"
          tar xzf dist/jen-head.tar.gz -C "$RUNNER_TEMP/install-no-kea"
          cd "$RUNNER_TEMP/install-no-kea/jen"
          sudo TERM=linux ./install.sh --answers "$RUNNER_TEMP/answers-no-kea.env" --unattended

      - name: Assert a Kea-less install lands a fresh superadmin on /setup
        run: |
          set -e
          systemctl is-active --quiet jen
          curl -sf http://127.0.0.1:5050/api/v1/health | grep -q jen_version
          echo "Kea-less install is healthy"

          cookie="$RUNNER_TEMP/cookies-no-kea.txt"
          csrf=$(curl -sc "$cookie" http://127.0.0.1:5050/login | grep -oP 'name="csrf_token" value="\K[^"]+' | head -1)
          [[ -n "$csrf" ]]
          login_location=$(curl -sb "$cookie" -c "$cookie" -X POST http://127.0.0.1:5050/login \
            -d "username=admin&password=ci-test-passw0rd-!&csrf_token=$csrf" \
            -o /dev/null -w '%{redirect_url}')
          echo "login redirected to: $login_location"
          # %{redirect_url} is already an absolute URL (http://127.0.0.1:5050/),
          # not a path — curl it directly rather than re-prefixing the host.
          dashboard_location=$(curl -sb "$cookie" -c "$cookie" "$login_location" \
            -o /dev/null -w '%{redirect_url}')
          echo "dashboard redirected to: $dashboard_location"
          [[ "$dashboard_location" == *"/setup"* ]]
          echo "a fresh, Kea-less superadmin lands on /setup"

      - name: Uninstall the no-Kea install
        working-directory: ${{ runner.temp }}/install-no-kea/jen
        run: printf 'y\n1\n' | sudo ./uninstall.sh

      - name: Kea log on failure
        if: failure()
        run: docker logs kea 2>&1 | tail -100 || true

      - name: Jen service log on failure
        if: failure()
        run: sudo journalctl -u jen -n 200 --no-pager || true

  bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install bandit
        run: pip install -q bandit

      - name: Run bandit
        # -ll: only report medium/high confidence findings — low-confidence
        # noise isn't worth gating a release over. -r: recursive.
        # -b: diff against .github/bandit-baseline.json, a snapshot of the
        # 53 findings that existed as of the v5.0 Phase 1 IPv6 work, each
        # manually traced and verified safe (whitelisted table names,
        # int()-cast values, trust-on-first-use SSH host-key persistence —
        # see docs/THREAT_MODEL.md). This means CI only fails on genuinely
        # NEW findings introduced going forward, not on the already-reviewed
        # backlog — verified directly: re-running bandit against an injected
        # fake shell=True call still fails even with the baseline present.
        run: bandit -r jen/ plugins/ -ll -b .github/bandit-baseline.json

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies + pip-audit
        # Runtime pins come from requirements.txt (see note in the pytest
        # job). pip-audit then checks whatever actually got installed.
        run: |
          pip install -q --upgrade pip
          pip install -q -r requirements.txt pip-audit

      - name: Run pip-audit
        # Floor-pinned deps (jen/config.py) mean the *installed* version can
        # be newer than the pin — pip-audit checks what's actually installed,
        # which is exactly what a real deployment would end up running.
        # Verified clean in an isolated environment matching this exact
        # install command: 0 findings against every one of Jen's actual
        # runtime dependencies, once pip itself is upgraded first (an
        # outdated bundled pip is a false-positive source here — it's build
        # tooling, not something Jen's code ever imports at runtime).
        run: pip-audit
