name: Kea compatibility

# v5.48.x (Q50) — Jen's Kea client against REAL kea-dhcp4 daemons, not the
# fakes and mocked replies the unit and e2e suites use. Weekly, plus on
# demand (`gh workflow run kea-compat.yml`); deliberately NOT called from
# ci.yml or release.yml — an upstream Kea release must never turn a
# push or a tagged release red. Read-only against Kea: config-get and
# config-test, never config-set; the one write is a throwaway reservation.
#
# Images are ISC's own, on Cloudsmith (docker.cloudsmith.io/isc/docker/…),
# pulled anonymously. Their tags are EXACT patch versions — there is no
# floating `3.0`; when Kea ships a new patch, bump the matrix.
#   3.0.x  LTS      3.2.x  stable      3.3.x  dev (informational only)
on:
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  KEA_REGISTRY: docker.cloudsmith.io/isc/docker

# v5.67.0-beta.10 (Q122) — see tests.yml: every step under pipefail, enforced by tests/test_workflow_hygiene.py.
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  compat:
    name: Kea ${{ matrix.kea }}${{ matrix.dev && ' (dev, non-blocking)' || '' }}
    runs-on: ubuntu-latest
    # The dev leg informs, it never blocks: a red 3.3 is a heads-up about
    # what the next stable will do, not a Jen defect to fix this week.
    continue-on-error: ${{ matrix.dev }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - kea: 3.0.3
            dev: false
          - kea: 3.2.0
            dev: false
          - kea: 3.3.1
            dev: true

    env:
      JEN_ROOT: ${{ github.workspace }}
      IMAGE: docker.cloudsmith.io/isc/docker/kea-dhcp4:${{ matrix.kea }}

    services:
      database:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: kea
          MYSQL_USER: kea
          MYSQL_PASSWORD: kea_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -pci_root_pw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -q -r requirements.txt pytest

      - name: Pull the Kea image
        run: |
          if ! docker pull "$IMAGE"; then
            echo "::error::Could not pull $IMAGE — the tag may have been removed or renamed. Tags are exact patch versions; check https://cloudsmith.io/~isc/repos/docker/ and update the matrix."
            exit 1
          fi

      # MariaDB 11.4 because Kea 3.2's bundled client refuses a server
      # with no TLS at all ("SSL is required, but the server does not
      # support it") and 11.4 is the first image that serves TLS with a
      # self-generated cert out of the box — hence peer verification off
      # on the daemon below (a throwaway loopback database).
      - name: Install the Kea MySQL schema
        # No kea-admin image is published, so borrow the daemon image
        # (it already has ISC's apk repo configured) and add kea-admin at
        # the SAME version — the schema must match the daemon.
        # The image removes ISC's apk repo after building, so re-add it
        # exactly the way ISC's Dockerfile picked it: even minor = the
        # kea-X-Y LTS/stable repo, odd minor = kea-dev.
        run: |
          docker run --rm --network host --entrypoint ash "$IMAGE" -c '
            set -e
            apk add --no-cache curl bash >/dev/null
            v="${{ matrix.kea }}"; minor=$(echo "$v" | cut -d . -f 2)
            if [ $((minor % 2)) = 0 ]; then repo="kea-$(echo "$v" | cut -d . -f 1)-$minor"; else repo=kea-dev; fi
            curl -1sLf "https://dl.cloudsmith.io/public/isc/$repo/setup.alpine.sh" | bash >/dev/null
            apk update >/dev/null
            apk search -v "isc-kea*"
            apk add --no-cache mariadb-client "isc-kea-admin~=$v" >/dev/null
            echo "[client]" > /etc/my.cnf.d/nossl.cnf
            echo "skip-ssl" >> /etc/my.cnf.d/nossl.cnf
            kea-admin db-init mysql -h 127.0.0.1 -u kea -p kea_pw -n kea
          '

      - name: Start kea-dhcp4
        run: |
          mkdir -p kea-conf results
          python -m tests.kea_compat.kea_config > kea-conf/kea-dhcp4.conf
          printf '%s' jen > kea-conf/jen-api.user
          printf '%s' jen_api_pw > kea-conf/jen-api.pw
          chmod 644 kea-conf/jen-api.user kea-conf/jen-api.pw
          docker run -d --name kea --network host --tmpfs /var/run/kea \
            -e MARIADB_TLS_DISABLE_PEER_VERIFICATION=1 \
            -v "$PWD/kea-conf:/etc/kea:ro" "$IMAGE"
          for i in $(seq 1 30); do
            if curl -sf -m 2 -H 'Content-Type: application/json' \
                 -u jen:jen_api_pw -d '{"command":"version-get"}' http://127.0.0.1:8004/ >/dev/null; then
              echo "kea-dhcp4 answered after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::kea-dhcp4 ${{ matrix.kea }} never answered on :8004"
          docker logs kea
          exit 1

      - name: Run the compatibility suite
        env:
          KEA_COMPAT_URL: http://127.0.0.1:8004/
          KEA_COMPAT_USER: jen
          KEA_COMPAT_PASS: jen_api_pw
          KEA_COMPAT_VERSION: ${{ matrix.kea }}
          KEA_COMPAT_RESULTS: ${{ github.workspace }}/results/${{ matrix.kea }}.json
          KEA_COMPAT_PKT4_OUT: ${{ github.workspace }}/results/pkt4-${{ matrix.kea }}.json
          KEA_COMPAT_IDENT_OUT: ${{ github.workspace }}/results/ident-${{ matrix.kea }}.json
          # v5.67.0-beta.13 (Q127) — the database half: Jen's imports, merges, migrations and the reservation
          # export against the `kea-admin db-init`ed schema above (tests/kea_compat/test_db_moves.py), and
          # the facts of ISC's real schema it records (unique keys, foreign-key rules, option scopes)
          KEA_COMPAT_DB_HOST: 127.0.0.1
          KEA_COMPAT_DB_PORT: '3306'
          KEA_COMPAT_DB_USER: kea
          KEA_COMPAT_DB_PASS: kea_pw
          KEA_COMPAT_DB_NAME: kea
          KEA_COMPAT_DB_ROOT_PASS: ci_root_pw
          KEA_COMPAT_SCHEMA_OUT: ${{ github.workspace }}/results/schema-${{ matrix.kea }}.json
          # v5.68.0-beta.6 (Q141) - who owns ISC's kea-dhcp4 and who the daemon runs as on this image
          # (tests/kea_compat/test_binary_facts.py): the helper's two-tier trust rule is written against it
          KEA_COMPAT_BINARY_OUT: ${{ github.workspace }}/results/binary-${{ matrix.kea }}.json
        run: python -m pytest tests/kea_compat -m kea_compat -v

      # v5.68.0-beta.2 (Q135) - what a real daemon writes about one client at each log level, and what it stores in the
      # lease row (tests/kea_compat/test_log_levels.py). It restarts the daemon once per level, so it cannot share the
      # suite above (-m kea_compat leaves it out); the findings are in results/log-levels-<version>.json and the raw logs
      # in results/logs-<version>/.
      - name: What Kea's log carries at each level
        if: always()
        env:
          KEA_COMPAT_URL: http://127.0.0.1:8004/
          KEA_COMPAT_USER: jen
          KEA_COMPAT_PASS: jen_api_pw
          KEA_COMPAT_VERSION: ${{ matrix.kea }}
          KEA_COMPAT_IMAGE: ${{ env.IMAGE }}
          KEA_COMPAT_CONF_DIR: ${{ github.workspace }}/kea-conf
          KEA_COMPAT_LOG_DIR: ${{ github.workspace }}/results/logs-${{ matrix.kea }}
          KEA_COMPAT_LOG_OUT: ${{ github.workspace }}/results/log-levels-${{ matrix.kea }}.json
          KEA_COMPAT_DB_HOST: 127.0.0.1
          KEA_COMPAT_DB_PORT: '3306'
          KEA_COMPAT_DB_USER: kea
          KEA_COMPAT_DB_PASS: kea_pw
          KEA_COMPAT_DB_NAME: kea
        run: python -m pytest tests/kea_compat/test_log_levels.py -m kea_log -v

      - name: Kea log
        if: always()
        run: docker logs kea > results/kea-${{ matrix.kea }}.log 2>&1 || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kea-compat-${{ matrix.kea }}
          path: results/
          if-no-files-found: ignore

  summary:
    name: Version x check table
    needs: compat
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kea-compat-*
          path: artifacts

      - name: Write the summary
        run: |
          {
            echo "## Jen against real Kea"
            echo
            python -m tests.kea_compat.summarize artifacts/*/[0-9]*.json
            echo
            echo "### The Kea daemon binary on ISC's images"
            echo
            echo "| image | owner:group | uid | mode | daemon runs as | image USER | helper would run it |"
            echo "|---|---|---|---|---|---|---|"
            for f in artifacts/*/binary-*.json; do
              [ -e "$f" ] || continue
              python - "$f" <<'PY'
          import json, os, sys
          d = json.load(open(sys.argv[1]))
          v = os.path.basename(sys.argv[1])[len('binary-'):-len('.json')]
          r = d.get('daemon_runs_as') or {}
          print(f"| {v} | {d['owner']}:{d['group']} | {d['uid']} | {d['mode']} | {r.get('name')} ({r.get('uid')}) | {d['image_user']} | {d['helper_would_run_it']} |")
          PY
            done
            echo
            echo
            echo "### /etc/kea on ISC's images (what the helper's 0644 validation copy used to depend on)"
            echo
            echo "| image | /etc/kea owner:group | mode | any account can enter | kea-dhcp4.conf owner:group | mode |"
            echo "|---|---|---|---|---|---|"
            for f in artifacts/*/binary-*.json; do
              [ -e "$f" ] || continue
              python - "$f" <<'PY'
          import json, os, sys
          d = json.load(open(sys.argv[1]))
          v = os.path.basename(sys.argv[1])[len('binary-'):-len('.json')]
          e = d.get('etc_kea') or {}
          c = d.get('etc_kea_dhcp4_conf') or {}
          print(f"| {v} | {e.get('owner')}:{e.get('group')} | {e.get('mode')} | {e.get('world_traversable')} | {c.get('owner')}:{c.get('group')} | {c.get('mode')} |")
          PY
            done
            echo
            echo "3.3 is Kea's development line: a failure there is informational."
            echo "The pkt4-* statistic names each version reports are in the per-version artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
