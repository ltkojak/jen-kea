name: System boundaries

# v5.64.x (Q84) — the ten places Jen touches something it does not own,
# each broken on purpose against REAL processes: Jen under gunicorn, two
# Kea hosts (kea-dhcp4 + sshd + the jen-kea-helper Jen installs through
# its own install_helper path), MariaDB, and two fault injectors (a
# resolver that goes silent, a Control Agent that answers 500). No mocks:
# the unit suite proves each rule in isolation; this proves the rules
# survive contact with processes that die, stall and lie.
#
# Weekly, on demand (`gh workflow run system-tests.yml`), on every
# release-candidate tag (`vX.Y.Z-rc.N`), and - since v5.65.6 (Q95) - on every
# beta tag (`vX.Y.Z-beta.N`), where it runs the CRITICAL subset only (Docker boot,
# restore, the change-set partial failure and both rollback scenarios, and
# /api/v1/health with Kea frozen: the ones an operator's data or a self-update
# depends on); the full set stays weekly / rc / dispatch. Deliberately NOT called from
# ci.yml or release.yml — like kea-compat.yml, a slow or flaky boundary
# test must never turn a push or a tagged release red. A red run is read
# in the job summary; it does not open an issue.
#
# `select` narrows a dispatch to a pytest -k expression (e.g. `stack or restore`).
on:
  schedule:
    - cron: '43 4 * * 2' # Tuesdays 04:43 UTC
  workflow_dispatch:
    inputs:
      select:
        description: 'pytest -k expression (blank = all scenarios)'
        required: false
        default: ''
  push:
    tags:
      - 'v*-rc.*'
      - 'v*-beta.*'

permissions:
  contents: read

jobs:
  system:
    name: Boundary scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      JEN_SYSTEM_TESTS: '1'
      SYS_WORK: ${{ github.workspace }}/system-work
      SYS_RESULTS: ${{ github.workspace }}/system-results/results.json

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -q -r requirements.txt pytest

      - name: Run the scenarios
        env:
          SELECT: ${{ github.event.inputs.select }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          # 00 the stack boots, 01 restore, 02 change set when a server dies, 03 failed-restart rollback,
          # 11 /api/v1/health with Kea frozen, 12 a revert whose restart fails is a persistent rollback_failed
          CRITICAL: 'test_00 or test_01 or test_02 or test_03 or test_11 or test_12'
        run: |
          mkdir -p system-results
          if [ -z "$SELECT" ] && [ "$EVENT" = "push" ] && [[ "$REF_NAME" == *-beta.* ]]; then
            SELECT="$CRITICAL"
            echo "beta tag $REF_NAME: running the critical subset ($SELECT)"
          fi
          if [ -n "$SELECT" ]; then
            python -m pytest tests/system -m system -v -k "$SELECT"
          else
            python -m pytest tests/system -m system -v
          fi

      - name: Container state on failure
        if: failure()
        run: docker ps -a || true

      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: system-tests
          path: |
            system-results/
            system-work/results/
          if-no-files-found: ignore

      - name: Write the summary
        if: always()
        run: |
          {
            echo "## Jen system boundaries"
            echo
            python -m tests.system.summarize system-results/results.json
          } >> "$GITHUB_STEP_SUMMARY"

  # v5.65.1 (Q90) — the SHIPPED compose file, on a clean checkout, exactly as
  # the README tells an operator to run it: `docker compose up` with a .env.
  # The scenarios above run the image through the harness's own compose file;
  # this proves the one operators use actually boots (the image once shipped
  # with no WORKDIR and gunicorn died with "No module named 'jen'").
  shipped-compose:
    name: The shipped docker-compose.mysql.yml boots
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The Kea address is a closed local port: this job proves the CONTAINER boots. (A blackholed
      # Kea makes /api/v1/health itself take ~20 s; see the Q90 notes in PENDING.)
      - name: Write a .env the way .env.example asks
        run: |
          cat > .env <<'ENVEOF'
          JEN_DATABASE_MODE=bundled
          JEN_KEA_API_URL=http://127.0.0.1:9
          JEN_KEA_API_USER=kea-api
          JEN_KEA_API_PASS=unused-in-this-probe
          JEN_KEA_DB_HOST=127.0.0.1
          JEN_KEA_DB_USER=kea
          JEN_KEA_DB_PASS=unused-in-this-probe
          JEN_INITIAL_ADMIN_PASSWORD=probe-Adm1n-Pass!
          MYSQL_ROOT_PASSWORD=probe-root-pw
          JEN_MYSQL_PASSWORD=probe-jen-pw
          ENVEOF

      - name: docker compose up
        run: docker compose -f docker-compose.mysql.yml up -d --build

      - name: Jen answers on its health endpoint
        run: |
          for i in $(seq 1 60); do
            if curl -sf -m 3 http://127.0.0.1:5050/api/v1/health | grep -q jen_version; then
              echo "Jen answered after ~$((i * 3))s"; exit 0
            fi
            sleep 3
          done
          echo "::error::Jen never answered /api/v1/health after docker compose up"
          exit 1

      - name: Container logs
        if: always()
        run: docker compose -f docker-compose.mysql.yml logs --no-color --tail 80 jen || true

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.mysql.yml down -v || true
