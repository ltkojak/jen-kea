name: Create Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v3.7.5)'
        required: true

jobs:
  test:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read
    with:
      # v5.66.0-beta.2 (Q104) — test the exact commit this job is about to archive, sign
      # and extract release notes from below, not whatever main has drifted to since (a
      # workflow_dispatch's default ref is the branch it was run from, not the tag).
      ref: ${{ github.event.inputs.tag || github.ref }}
    secrets:
      JEN_DOCS_FORBIDDEN: ${{ secrets.JEN_DOCS_FORBIDDEN }}

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Extract version info
        id: version
        run: |
          # Support both tag push and manual workflow_dispatch
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          SERIES="${MAJOR}.${MINOR}.x"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "series=$SERIES" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT

      - name: Build tarball
        run: |
          mkdir -p dist
          # Package the repo contents as jen/ directory — from the TAG, not
          # HEAD: identical on a tag push, but a workflow_dispatch with a
          # tag input used to archive the default branch and label it with
          # that tag (v5.8.4). legacy/ is export-ignored via .gitattributes.
          # v5.66.0-beta.2 (Q104, item h) — built uncompressed first: the helper's own
          # signature is appended inside this tar (below) before it's ever gzipped, so
          # a tarball install always has jen-kea-helper.sig sitting next to jen-kea-helper
          # with no separate fetch needed.
          git archive --format=tar --prefix=jen/ "${{ steps.version.outputs.tag }}" \
            -o dist/jen-v${{ steps.version.outputs.version }}.tar
          echo "Tar built: $(ls -lh dist/)"

      - name: Extract jen-kea-helper from the tarball
        # v5.66.0 (Q103) — the exact bytes a box will install: signing the CHECKOUT's copy
        # would leave a gap between what CI verified and what the tag actually ships (the same
        # reason the tarball itself is built from the tag, not HEAD, above).
        run: |
          cd dist
          tar xf jen-v${{ steps.version.outputs.version }}.tar jen/jen-kea-helper -O > jen-kea-helper
          ls -la jen-kea-helper

      - name: Sign the Kea host helper
        # v5.66.0 (Q103) — same key, a DISTINCT namespace ("jen-kea-helper", never "jen-release")
        # so a checksum signature can never be replayed as a helper-update signature or vice
        # versa. jen-kea-helper's own "update" op verifies this exact signature under this exact
        # namespace before ever replacing itself.
        run: |
          cd dist
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "${{ secrets.RELEASE_SIGNING_KEY }}" > "$key_file"
          chmod 600 "$key_file"
          ssh-keygen -Y sign -f "$key_file" -n jen-kea-helper jen-kea-helper
          ls -la jen-kea-helper.sig

      - name: Append the helper signature into the tarball
        # v5.66.0-beta.2 (Q104, item h) — staged under jen/ so its path inside the tar
        # matches every other file; --owner=0 --group=0 --mode=0644 matches how `git
        # archive` itself laid the rest of the tree down. Gzipped only after this append,
        # so SHA256SUMS (next) checksums the exact bytes that ship.
        run: |
          mkdir -p dist/stage/jen
          cp dist/jen-kea-helper.sig dist/stage/jen/jen-kea-helper.sig
          tar --append --file=dist/jen-v${{ steps.version.outputs.version }}.tar \
            -C dist/stage --owner=0 --group=0 --mode=0644 jen/jen-kea-helper.sig
          gzip -9 dist/jen-v${{ steps.version.outputs.version }}.tar
          echo "Tarball built: $(ls -lh dist/)"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum jen-v${{ steps.version.outputs.version }}.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Sign checksums
        # v5.26.0 (Q22) — every release from here on is signed with the
        # private half of the ed25519 key whose public half is embedded
        # as RELEASE_SIGNERS in jen-update-root.py; the self-updater
        # refuses to install anything unsigned. ssh-keygen (openssh-client)
        # is preinstalled on ubuntu-latest runners — no new dependency.
        # The private key only ever exists as this one 0600 temp file,
        # for the lifetime of this step, on a throwaway runner.
        run: |
          cd dist
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "${{ secrets.RELEASE_SIGNING_KEY }}" > "$key_file"
          chmod 600 "$key_file"
          ssh-keygen -Y sign -f "$key_file" -n jen-release SHA256SUMS
          ls -la SHA256SUMS.sig

      - name: Verify both signatures before publishing
        # v5.66.0-beta.2 (Q104, item f) — a release job that signs but never re-checks its
        # own output could publish a mis-signed release without ever finding out. Verify
        # against RELEASE_SIGNERS as extracted from the TARBALL'S OWN jen-update-root.py
        # (the exact copy this release ships, not this checkout's), the same "verify what
        # you actually shipped" discipline as building the tarball from the tag rather
        # than HEAD, above. Either failure fails the job before a release is ever created.
        run: |
          cd dist
          signers_line="$(tar xzf jen-v${{ steps.version.outputs.version }}.tar.gz jen/jen-update-root.py -O \
            | sed -n 's/^RELEASE_SIGNERS = "\(.*\)"$/\1/p')"
          if [[ -z "$signers_line" ]]; then
            echo "::error::could not find RELEASE_SIGNERS in the tarball's own jen-update-root.py"
            exit 1
          fi
          printf '%s\n' "$signers_line" > allowed_signers
          ssh-keygen -Y verify -f allowed_signers -I release@jen -n jen-release \
            -s SHA256SUMS.sig < SHA256SUMS
          ssh-keygen -Y verify -f allowed_signers -I release@jen -n jen-kea-helper \
            -s jen-kea-helper.sig < jen-kea-helper
          echo "Both signatures verified against the tarball's own RELEASE_SIGNERS."

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MAJOR="${{ steps.version.outputs.major }}"
          MINOR="${{ steps.version.outputs.minor }}"
          SERIES="${{ steps.version.outputs.series }}"

          # Find series title from the first matching entry if it has one
          # Extract all ## [MAJOR.MINOR.x] entries from CHANGELOG.md
          python3 << PYEOF
          import re, sys

          with open('CHANGELOG.md') as f:
              content = f.read()

          major = '$MAJOR'
          minor = '$MINOR'
          version = '$VERSION'
          series = '$SERIES'

          # Find all entries for this major.minor series
          pattern = re.compile(
              r'(## \[' + re.escape(major) + r'\.' + re.escape(minor) + r'\.\d+(?:-(?:beta|rc)\.\d+)?\].*?)(?=\n## \[|\Z)',
              re.DOTALL
          )
          entries = pattern.findall(content)

          if not entries:
              notes = f"## Jen v{version}\n\nSee CHANGELOG.md for details."
          else:
              # Build release notes: header + all series entries
              notes = f"# Jen v{version} — {series} Series\n\n"
              notes += "\n\n---\n\n".join(e.strip() for e in entries)

          # Write to file (avoids shell escaping issues)
          with open('/tmp/release_notes.md', 'w') as f:
              f.write(notes)

          print(f"Extracted {len(entries)} changelog entries for {series}")
          PYEOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Jen v${{ steps.version.outputs.version }}"
          body_path: /tmp/release_notes.md
          files: |
            dist/jen-v${{ steps.version.outputs.version }}.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/jen-kea-helper
            dist/jen-kea-helper.sig
          draft: false
          # v5.32.0 (Q38) — a tag with a prerelease suffix (v5.33.0-beta.1,
          # v5.33.0-rc.1) is published as a GitHub pre-release: boxes on the
          # beta channel are offered it, boxes on stable never see it.
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
