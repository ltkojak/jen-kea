[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    e2e: browser end-to-end test (Playwright, tests/e2e/) — needs `playwright install chromium` and a MariaDB; run explicitly with `pytest tests/e2e -m e2e`, never part of the default run
