# ruff.toml
# ─────────
# v5.3.3 — Ruff added to this project for the first time, per a
# third-party review's recommendation. Deliberately kept as a
# standalone config file rather than a [tool.ruff] section inside a
# pyproject.toml.
#
# v5.4.1 — dependency declarations were consolidated into
# requirements.txt / requirements-dev.txt (see docs/ARCHITECTURE.md
# §3.5), NOT a pyproject.toml: Jen is still a run-from-checkout app,
# not a pip-installable package, so there's no [project]/[build-system]
# to attach this config to. If Jen ever becomes a real package, this
# config can move into that pyproject.toml at that time.

target-version = "py310"
line-length = 120

# legacy/jen.py is explicitly documented (see its own header comment)
# as the pre-v2.6.0 monolith, retained for reference only and never
# imported or executed by the live application. Linting it would only
# add noise for a file nobody should be actively maintaining, and
# could mask real findings in the active jen/ package underneath that
# noise.
exclude = ["legacy"]

# v5.6.0 — the whole codebase was run through `ruff format` +
# `ruff check --fix` (one mechanical, zero-behaviour-change pass), and
# CI now gates on `ruff check .` and `ruff format --check .` (see
# .github/workflows/tests.yml). New lint/format regressions fail the
# build. Rule selection stays deliberately conservative — the goal is
# real mistakes (dead imports, undefined names, obvious bugs) plus
# consistent formatting, not a maximal style regime:
#   F   — pyflakes: unused imports/variables, undefined names, etc.
#   E/W — pycodestyle: whitespace, basic style consistency
#   I   — isort: import ordering
#   UP  — pyupgrade: modernize syntax for the target Python version
#   B   — bugbear: common real bugs (mutable default args, bare
#         except, etc.) that aren't already covered by pyflakes
#   SIM — flake8-simplify: nested `with`, needless bool returns,
#         `contextlib.suppress` over try/except/pass (v5.11.1)
#   C4  — flake8-comprehensions: unnecessary dict()/list()/set()/
#         generator calls a literal or comprehension does better (v5.11.1)
#   PIE — flake8-pie: `lambda: []`-style reimplemented builtins,
#         repeated `.startswith`/`.endswith` (v5.11.1)
#   RUF100 — unused `# noqa` directives, stale after this rule move (v5.11.1)
[lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "C4", "PIE", "RUF100"]
ignore = [
    "E501",   # line-too-long — line-length above is a soft target for
              # new/reformatted code, not a hard gate on 10k+ existing
              # lines; letting the formatter (not manual rewrapping)
              # handle this over time avoids a wall of unrelated diffs
    "B008",   # function calls in default arguments — Flask route
              # decorators and similar patterns in this codebase rely
              # on this and it isn't a real bug in that context
    "SIM108", # if-else-block-instead-of-if-exp — a readable if/else
              # beats a dense ternary; taste, not correctness
]

[lint.isort]
known-first-party = ["jen"]

[format]
quote-style = "double"
