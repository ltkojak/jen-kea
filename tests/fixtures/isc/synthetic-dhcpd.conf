# dhcpd.conf — synthetic, covers every construct the ISC importer handles
# and every unsupported one once (tests/test_isc_dhcp_import.py).

option domain-name "example.lan";
option domain-name-servers 10.0.0.53, 10.0.0.54;
option ntp-servers 10.0.0.123;
option domain-search "example.lan", "corp.example.lan";
default-lease-time 600;
max-lease-time 7200;
authoritative;
ddns-update-style none;
log-facility local7;
ping-check on;
use-host-decl-names on;

# option definitions are not supported (line 18)
option space cisco;
option cisco.tftp code 150 = array of ip-address;
option custom-thing code 224 = text;
option custom-thing "hello; world";

include "/etc/dhcp/extra.conf";

failover peer "dhcp-failover" {
    primary;
    address 10.0.0.2;
    port 647;
    peer address 10.0.0.3;
    peer port 647;
    max-response-delay 60;
    max-unacked-updates 10;
    mclt 3600;
    split 128;
    load balance max seconds 3;
}

omapi-port 7911;

class "pxe-clients" {
    match if substring(option vendor-class-identifier, 0, 9) = "PXEClient";
    filename "pxelinux.0";
    option tftp-server-name "10.0.0.5";
}

class "voip-phones" {
    match if option vendor-class-identifier = "Cisco Systems, Inc. IP Phone";
    option ntp-servers 10.0.0.124;
}

class "printers" {
    match if substring(hardware, 1, 3) = 00:80:77;
}

class "the boss laptop" {
    match if hardware = 1:aa:bb:cc:dd:ee:ff;
}

class "mixed" {
    match if (option user-class = "a") and (option host-name = "b") or (option user-class = "c");
}

class "regex-class" {
    match if option vendor-class-identifier ~= "^Foo";
}

class "spawned" {
    spawn with option agent.circuit-id;
    lease limit 4;
}

class "sub-parent" {
    match hardware;
}
subclass "sub-parent" 1:00:11:22:33:44:55;

# Office LAN
subnet 10.0.1.0 netmask 255.255.255.0 {
    option routers 10.0.1.1;
    option broadcast-address 10.0.1.255;
    option rfc3442-classless-static-routes 24, 10,9,8, 10,0,1,1, 0, 10,0,1,1;
    default-lease-time 3600;
    max-lease-time 86400;
    next-server 10.0.0.5;
    filename "undionly.kpxe";
    range 10.0.1.100 10.0.1.149;
    range 10.0.1.160 10.0.1.199;
    range dynamic-bootp 10.0.1.200 10.0.1.209;
    pool {
        range 10.0.1.210 10.0.1.219;
        allow members of "voip-phones";
    }
    pool {
        range 10.0.1.220 10.0.1.229;
        deny members of "printers";
        option routers 10.0.1.2;
    }
    pool {
        range 10.0.1.230 10.0.1.239;
        allow members of "pxe-clients";
        allow members of "voip-phones";
    }
    pool {
        range 10.0.1.240 10.0.1.249;
        allow members of "not-declared";
    }
    pool {
        range 10.0.1.250 10.0.1.253;
        allow members of "regex-class";
    }
    host printer-1 {
        hardware ethernet 0:80:77:1:2:3;
        fixed-address 10.0.1.50;
        option host-name "hp-printer";
    }
    host nas {
        hardware ethernet 00:11:32:aa:bb:cc;
        fixed-address 10.0.1.51;
        option domain-name-servers 10.0.1.1;
        option subnet-mask 255.255.255.0;
    }
    if option user-class = "weird" {
        option routers 10.0.1.9;
    }
}

shared-network CAMPUS {
    option domain-name "campus.example.lan";
    # Students
    subnet 10.0.2.0 netmask 255.255.255.0 {
        option routers 10.0.2.1;
        range 10.0.2.10 10.0.2.250;
        deny unknown-clients;
        allow dynamic bootp;
    }
    subnet 10.0.3.0 netmask 255.255.255.0 {
        option routers 10.0.3.1;
        range 10.0.3.10 10.0.3.250;
    }
}

# reservations only — no range
subnet 10.0.4.0 netmask 255.255.255.0 {
    option routers 10.0.4.1;
}

subnet 10.0.5.0 netmask 255.255.255.0 {
    range 10.0.5.10 10.0.5.20;
    range 10.0.5.15 10.0.5.30;
    range 10.0.5.31 10.0.5.40;
    range 10.0.6.1 10.0.6.5;
}

subnet 192.168.99.0 netmask 255.255.255.0 {
    range 192.168.99.10 192.168.99.20;
}
subnet 192.168.99.0 netmask 255.255.255.0 {
    range 192.168.99.30 192.168.99.40;
}

group {
    option domain-name-servers 10.0.0.55;
    next-server 10.0.0.6;
    host camera-1 {
        hardware ethernet 00:aa:bb:cc:dd:01;
        fixed-address 10.0.4.10;
    }
    host camera-2 {
        hardware ethernet 00:aa:bb:cc:dd:02;
        fixed-address 10.0.4.11, 10.0.4.12;
        option host-name "Camera Two (rear)";
    }
}

host homeless {
    hardware ethernet 00:aa:bb:cc:dd:03;
    fixed-address 172.16.0.9;
}

host by-name {
    hardware ethernet 00:aa:bb:cc:dd:04;
    fixed-address printer.example.lan;
}

host no-address {
    hardware ethernet 00:aa:bb:cc:dd:05;
    option host-name "opts-only";
}

host client-id-only {
    option dhcp-client-identifier "phone-42";
    fixed-address 10.0.2.9;
}

host banned {
    hardware ethernet 00:aa:bb:cc:dd:06;
    fixed-address 10.0.2.8;
    deny booting;
}

host token {
    hardware token-ring 00:aa:bb:cc:dd:07;
    fixed-address 10.0.2.7;
}

host pxe-box {
    hardware ethernet 00:aa:bb:cc:dd:08;
    fixed-address 10.0.2.6;
    filename "special.kpxe";
}

key DHCP_UPDATER {
    algorithm hmac-md5;
    secret "not-a-real-secret";
}

zone example.lan. {
    primary 10.0.0.53;
    key DHCP_UPDATER;
}

frobnicate on;
