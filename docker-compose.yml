# ─────────────────────────────────────────────────────────────────────────────
# Jen - The Kea DHCP Management Console
# Docker Compose — External MySQL
#
# Use when connecting Jen to an existing MySQL/MariaDB server.
#
# Quick start:
#   cp .env.example .env
#   # Edit .env with your Kea and database details
#   docker compose up -d
#
# Config options (choose one):
#   A) Environment variables (recommended for Docker):
#      Fill in JEN_* vars in .env — config is auto-generated on first start
#
#   B) Mount your own jen.config:
#      Uncomment the jen.config volume line below and comment out env_file
# ─────────────────────────────────────────────────────────────────────────────

services:
  jen:
    build: .
    image: jen-dhcp:5.2.14
    container_name: jen
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-5050}:5050"
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      # Persistent config, certs, SSH keys, and backups
      - jen-config:/etc/jen
      # Persistent custom brand icons — survives container updates
      - jen-icons:/opt/jen/static/icons/custom
      # Option B: mount your own jen.config (uncomment to use)
      # - ./jen.config:/etc/jen/jen.config:ro
    env_file:
      - .env
    healthcheck:
      # v5.2.12 fix — "CMD" is Docker's exec form, which does NOT pass
      # the command through a shell. "||" was therefore never treated
      # as shell OR logic; it was passed to curl as a literal argument,
      # which curl doesn't understand. This healthcheck has never
      # actually done "try HTTP, fall back to HTTPS" — CMD-SHELL
      # invokes /bin/sh -c, so the shell (not curl) interprets ||.
      test: ["CMD-SHELL", "curl -sf http://localhost:5050/ || curl -skf https://localhost:8443/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - jen-network

volumes:
  jen-config:
    name: jen-config
  jen-icons:
    name: jen-icons

networks:
  jen-network:
    name: jen-network
