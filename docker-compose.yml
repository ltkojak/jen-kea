# ─────────────────────────────────────────────────────────────────────────────
# Jen - The Kea DHCP Management Console
# Docker Compose — External MySQL/MariaDB
#
# Use when Jen's own database lives on a server you already run. (For a
# Docker-managed database, use docker-compose.mysql.yml.)
#
# Quick start:
#   sudo ./install.sh --docker     # writes .env for you
#   # or, by hand:
#   cp .env.example .env           # fill in JEN_* (Kea + both DBs + admin pw)
#   docker compose up -d
#
# run.py turns the JEN_* vars from .env into /etc/jen/jen.config on the
# first start. To skip env vars entirely, uncomment the jen.config mount
# below and provide your own file.
# ─────────────────────────────────────────────────────────────────────────────

services:
  jen:
    build: .
    image: jen-dhcp:5.11.0
    container_name: jen
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-5050}:5050"
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      # Persistent config, certs, SSH keys, and backups
      - jen-config:/etc/jen
      # Persistent custom brand icons — survives container updates
      - jen-icons:/opt/jen/static/icons/custom
      # Escape hatch: mount a hand-written jen.config instead of using env vars.
      # - ./jen.config:/etc/jen/jen.config:ro
    env_file:
      - .env
    healthcheck:
      # v5.2.12 fix — "CMD" is Docker's exec form, which does NOT pass
      # the command through a shell. "||" was therefore never treated
      # as shell OR logic; it was passed to curl as a literal argument,
      # which curl doesn't understand. This healthcheck has never
      # actually done "try HTTP, fall back to HTTPS" — CMD-SHELL
      # invokes /bin/sh -c, so the shell (not curl) interprets ||.
      test: ["CMD-SHELL", "curl -sf http://localhost:5050/ || curl -skf https://localhost:8443/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - jen-network

volumes:
  jen-config:
    name: jen-config
  jen-icons:
    name: jen-icons

networks:
  jen-network:
    name: jen-network
