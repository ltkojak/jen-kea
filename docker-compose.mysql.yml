# ─────────────────────────────────────────────────────────────────────────────
# Jen - The Kea DHCP Management Console
# Docker Compose — Bundled MariaDB
#
# Docker runs a MariaDB container for Jen's own data (users, audit log,
# settings). The Kea database still connects to your external Kea server.
#
# Quick start:
#   sudo ./install.sh --docker         # writes .env for you, pick "Bundled"
#   # or, by hand:
#   cp .env.example .env               # fill in the Kea section +
#   #   MYSQL_ROOT_PASSWORD + JEN_MYSQL_PASSWORD + JEN_INITIAL_ADMIN_PASSWORD
#   docker compose -f docker-compose.mysql.yml up -d
#
# The jen service's Jen-DB connection is wired to the jen-mysql container
# below via `environment:` — you do NOT set JEN_DB_HOST/USER/PASS/NAME for
# the bundled path, only JEN_MYSQL_PASSWORD (used on both sides).
# ─────────────────────────────────────────────────────────────────────────────

services:
  jen:
    build: .
    image: jen-dhcp:5.8.2
    container_name: jen
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-5050}:5050"
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      - jen-config:/etc/jen
      - jen-icons:/opt/jen/static/icons/custom
      # Escape hatch: mount a hand-written jen.config instead of using env vars.
      # - ./jen.config:/etc/jen/jen.config:ro
    env_file:
      - .env
    environment:
      # Bundled-DB wiring — always points at the jen-mysql service, so .env
      # doesn't carry (or drift on) these four. JEN_MYSQL_PASSWORD is shared
      # with the jen-mysql container's MARIADB_PASSWORD below.
      JEN_DB_HOST: jen-mysql
      JEN_DB_USER: jen
      JEN_DB_NAME: jen
      JEN_DB_PASS: ${JEN_MYSQL_PASSWORD:?Set JEN_MYSQL_PASSWORD in .env}
    depends_on:
      jen-mysql:
        condition: service_healthy
    healthcheck:
      # v5.2.12 fix — "CMD" is Docker's exec form, which does NOT pass
      # the command through a shell. "||" was therefore never treated
      # as shell OR logic; it was passed to curl as a literal argument,
      # which curl doesn't understand. This healthcheck has never
      # actually done "try HTTP, fall back to HTTPS" — CMD-SHELL
      # invokes /bin/sh -c, so the shell (not curl) interprets ||.
      test: ["CMD-SHELL", "curl -sf http://localhost:5050/ || curl -skf https://localhost:8443/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - jen-network

  jen-mysql:
    image: mariadb:11
    container_name: jen-mysql
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env before running docker compose}
      MARIADB_DATABASE: jen
      MARIADB_USER: jen
      MARIADB_PASSWORD: ${JEN_MYSQL_PASSWORD:?Set JEN_MYSQL_PASSWORD in .env before running docker compose}
    volumes:
      - jen-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - jen-network
    expose:
      - "3306"

volumes:
  jen-config:
    name: jen-config
  jen-mysql-data:
    name: jen-mysql-data
  jen-icons:
    name: jen-icons

networks:
  jen-network:
    name: jen-network
